function home(){let s=getStats();let q=state.steps.filter(s=>s.status==='进行中'||s.status==='阻塞').slice(0,7);if(!q.length)q=state.steps.slice(0,7);return `<section class="hero"><div class="hero-content"><div class="eyebrow">PRODUCT LIFECYCLE · ENGINEERING PLAYBOOK</div><h1>动态倾角仪<br>从研发验证，到可复制的生产工艺</h1><p>双轴常温转台 × 双轴温控转台 × 六轴标定 × 动态融合 × 质量追溯。把每一项试验拆成目的、原理、方案、操作、准入、输出和风险，并让工艺持续迭代。</p><div class="hero-tags"><span>52 项内置工程节点</span><span>R10 + TiltLab V7.16</span><span>内容与参数可修改</span><span>离线独立运行</span></div></div><div class="gyroart"><svg viewBox="0 0 300 300" fill="none"><circle cx="150" cy="150" r="115" stroke="#7be3f4" stroke-width="1" stroke-dasharray="5 8"/><ellipse cx="150" cy="150" rx="110" ry="36" transform="rotate(-26 150 150)" stroke="#a0e9ff" stroke-width="2"/><ellipse cx="150" cy="150" rx="65" ry="112" transform="rotate(28 150 150)" stroke="#72bfff" stroke-width="3"/><circle cx="150" cy="150" r="34" fill="#ffffff0f" stroke="#c2faff" stroke-width="2"/><path d="M72 211L150 150L235 95M150 150V52" stroke="#a0faff" stroke-width="2"/><circle cx="150" cy="150" r="6" fill="#c2ffff"/><path d="M200 65h35M217 48v35" stroke="#bbdfff" stroke-width="2"/></svg></div></section>
${sectionStats()}${pageHeader('全流程总图','点击阶段卡进入对应步骤；研发内容可自由改，生产应用前需冻结和审批。',`<button class="btn soft" data-action="open-flow">进入流程工作区 →</button>`)}${phaseCards()}
<div class="sectionrow"><div class="panel"><div class="panel-header"><div><h3>下一步关注事项</h3><p>优先展示你标记的进行中或阻塞事项；尚未设置时展示前几步。</p></div><span class="pill blue">实时同步本地进度</span></div>${q.map(s=>`<div class="quickline"><span class="mini-index">${H(s.id)}</span><span class="quickname">${H(s.name)}</span>${badgeStatus(s.status)}<button data-action="open-step" data-step="${H(s.id)}">查看 →</button></div>`).join('')}</div><div class="stack"><div class="panel"><div class="panel-header"><div><h3>当前边界</h3><p>来源于你上传的工程说明，不应混为已验收结论。</p></div></div><div class="metricline"><span class="metricdot"></span><div><strong>常温研发试验</strong><p>2TD-600 为动态转台主场；必须核验真实角度反馈及停车。</p></div></div><div class="metricline"><span class="metricdot" style="background:#e7a16a"></span><div><strong>温度模型研发</strong><p>2FDT600WK + R10 以芯片均温和PLC状态构成温补准入链。</p></div></div><div class="metricline"><span class="metricdot" style="background:#c85e77"></span><div><strong>绝对精度目标仍待验证</strong><p>0.05° 是目标；历史离线回放、相对跟踪RMSE不可替代实时独立验收。</p></div></div></div><div class="notice warn"><strong>安全边界：</strong> 这是工艺规划和数据记录HTML，不连接PLC/IMU/转台，不提供实际运动控制。真实设备试验必须遵守厂家操作流程、现场值守、实体急停和停车反馈。</div></div></div>`}
function flowPage(){let p=phase(selectedPhase);let filtered=state.steps.filter(s=>s.phase===selectedPhase && (!searchText||(s.name+' '+s.goal+' '+s.id).toLowerCase().includes(searchText.toLowerCase())) && (statusFilter==='全部'||s.status===statusFilter));let step=getStep(selectedStep);if(!step||step.phase!==selectedPhase){step=state.steps.find(s=>s.phase===selectedPhase);selectedStep=step?.id;}return `${pageHeader('全流程 · 分步骤执行','选择某一项，即可查看步骤名称、目的、原理、方案、操作顺序、验收和原始证据。',`<button class="btn soft" data-action="new-step">＋ 新建步骤</button>`)}<div class="workflow"><aside class="panel stepbrowser"><div class="panel-header" style="margin-bottom:5px"><div><h3>研发工艺目录</h3><p>按阶段、状态和关键词快速定位</p></div><span class="pill gray">${state.steps.length} 项</span></div><div class="phasechooser">${state.phases.map(p=>`<button data-action="filter-phase" data-phase="${H(p.id)}" class="phasechoose ${p.id===selectedPhase?'active':''}">${H(p.id)}</button>`).join('')}</div><div style="font-size:11px;color:#75859a;margin-bottom:9px"><strong>${H(p.name)}</strong> · ${H(p.desc)}</div><div class="search"><span>⌕</span><input id="stepSearch" placeholder="搜索本阶段步骤" value="${H(searchText)}" aria-label="搜索步骤"></div><div class="filterline"><select id="statusFilter" class="field" aria-label="状态筛选">${['全部','未开始','进行中','已完成','阻塞'].map(n=>`<option ${statusFilter===n?'selected':''}>${n}</option>`).join('')}</select><button class="btn sm" data-action="clear-filter">重置筛选</button></div><div class="divider" style="margin:12px 0 6px"></div><div class="steplist">${filtered.length?filtered.map(s=>`<button class="stepitem ${s.id===selectedStep?'active':''}" data-action="select-step" data-step="${H(s.id)}"><span class="stepitem-id">${H(s.id)}</span><span class="stepitem-main"><strong>${H(s.name)}</strong><small>${H(s.equip)}</small></span><span class="statebadge ${H(s.status)}">${H(s.status)}</span></button>`).join(''):'<div class="empty">没有符合条件的步骤</div>'}</div></aside><main class="panel detail" id="stepDetail">${step?detailHTML(step):'<div class="empty">请添加步骤</div>'}</main></div>`}
function detailHTML(s){return `<div class="detail-top"><span class="tiny">${H(s.id)} / ${H(phase(s.phase).name)} / ${H(s.stage)} </span><h2>${H(s.name)}</h2><p>${H(s.goal)}</p><div class="detail-meta"><span>设备：${H(s.equip)}</span><span>责任人：${H(s.owner)}</span><span>预计时长：${H(s.duration)}</span></div></div><div class="detailcontrols"><label class="xsmall muted">执行状态</label><select id="stepStatus" class="field" style="width:115px">${['未开始','进行中','已完成','阻塞'].map(t=>`<option ${t===s.status?'selected':''}>${t}</option>`).join('')}</select><label class="xsmall muted">评审状态</label><select id="stepApproval" class="field" style="width:110px">${['未评审','待审批','已批准','不适用'].map(t=>`<option ${t===s.approval?'selected':''}>${t}</option>`).join('')}</select><span style="margin-left:auto"></span><button class="btn sm soft" data-action="toggle-edit">${editing?'取消编辑':'✎ 编辑内容'}</button><button class="btn sm" data-action="duplicate-step">复制步骤</button><button class="btn sm" data-action="move-up">↑</button><button class="btn sm" data-action="move-down">↓</button></div>${editing?editHTML(s):readHTML(s)}`}
function readHTML(s){const checklist=s.procedure||[], checked=s.checked||[];return `<div class="detail-body"><div class="descgrid"><section class="infobox focus"><h4>01 / 这一步做什么</h4><p>${H(s.goal)}</p></section><section class="infobox"><h4>02 / 原理是什么</h4><p>${H(s.principle)}</p></section><section class="infobox" style="grid-column:1/-1"><h4>03 / 配合当前设备的具体方案</h4><p>${H(s.scheme)}</p></section></div><div class="blockhead"><h3>04 / 实际执行顺序</h3><span class="pill blue">${checked.length}/${checklist.length} 个子项已勾选</span></div><div class="stepschain">${checklist.map((line,i)=>`<div class="chainitem"><div class="chainn">${i+1}</div><div class="chaintext" style="width:100%"><label style="display:flex;gap:9px;align-items:flex-start;cursor:pointer"><input type="checkbox" data-check-index="${i}" ${checked.includes(i)?'checked':''} style="accent-color:#3763d7;margin-top:5px"><span style="${checked.includes(i)?'text-decoration:line-through;color:#99a5b5':''}">${H(line)}</span></label></div></div>`).join('')}</div><div class="divider"></div><div class="descgrid"><div class="infobox"><h4>05 / 验证关卡与准入条件</h4><p>${H(s.gate)}</p></div><div class="infobox"><h4>06 / 易错点与安全风险</h4><p>${H(s.risk)}</p></div></div><div class="rowinfo"><label>产出 / 交付物</label><div>${H(s.output)}</div></div><div class="rowinfo"><label>记录与证据</label><div>${H(s.evidence)}</div></div><div class="rowinfo"><label>来源依据</label><div>${H(s.source)}</div></div><div class="rowinfo"><label>评审责任人</label><div>${H(s.approver||'尚未签署；已完成任务不等于评审通过')}</div></div><div class="rowinfo"><label>补充备注</label><div>${H(s.notes||'暂无；可以进入编辑模式填写实际现场情况。')}</div></div><div class="blockhead"><h3>执行日志 · 本地留痕</h3><button class="btn sm" data-action="add-log">＋ 添加记录</button></div><div id="logList">${(s.log||[]).length?s.log.map(l=>`<div class="logentry"><small>${H(l.at)} · ${H(l.author||'现场记录')}</small><div>${H(l.text)}</div></div>`).join(''):'<div class="notice">暂无现场执行记录。勾选步骤仅代表操作记录，完成与放行仍需对应实测证据。</div>'}</div><div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn danger sm" data-action="delete-step">删除此步骤</button></div></div>`}

${pageHeader('现有软件职责','只依据上传的R10与V7.16源码包及说明，不把未现场联调的功能视为完成验收。')}<div class="twocol"><div class="panel"><div class="panel-header"><h3>R10 · 常温 / 温补标定上位机</h3><span class="pill orange">实验与系数识别</span></div><div class="device-flow" style="flex-wrap:wrap"><div class="flowbox">IMU UID / 六轴原始量<small>固定硬件配置</small></div><div class="flowarrow">→</div><div class="flowbox">WK + PLC<small>SP / PV / Tchip</small></div><div class="flowarrow">→</div><div class="flowbox">工况采集<small>位置/速率/稳定</small></div><div class="flowarrow">→</div><div class="flowbox">28模型优选<small>分组验证</small></div></div><div class="divider"></div><p class="small muted">R10关键状态链：<b>设温 → 新鲜SP确认 → 初步到温 → 有效热浸 → 最终PV+芯片稳定 → 逐工况采集 → WK停车及PLC停止回读</b>。不完整任务保留数据但不正式放行。</p></div><div class="panel"><div class="panel-header"><h3>TiltLab V7.16 · 动态研究与诊断</h3><span class="pill blue">倾角实时验证</span></div><div class="device-flow" style="flex-wrap:wrap"><div class="flowbox">UID厂标定<small>ACC + GYRO</small></div><div class="flowarrow">→</div><div class="flowbox">时间轴与融合<small>采集/诊断隔离</small></div><div class="flowarrow">→</div><div class="flowbox">双轴静态预检<small>Roll / Pitch</small></div><div class="flowarrow">→</div><div class="flowbox">全程动态报告<small>绝对/相对分栏</small></div></div><div class="divider"></div><p class="small muted">默认通用基线为<strong>无杆臂</strong>重力约束。V7.16新观测器为研究候选；当前PC推算时基不满足已认证的≤${H(state.config.goalDynamic)}°实时绝对误差证明。</p></div></div><div class="notice blue" style="margin-top:16px">工况配置中有些串口号来自R10的用户配置文件，例如2TD COM4、WK内轴COM8/外轴COM9、IMU COM5。它们可能只适用于原Windows电脑，故此HTML不将串口号固定为全局有效值，也不会尝试连接设备。</div>`}
function simSVG(){return `<svg viewBox="0 0 940 246" role="img" aria-label="角度参考与测量示意曲线"><defs><linearGradient id="simArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fabe9" stop-opacity=".16"/><stop offset="1" stop-color="#7fabe9" stop-opacity="0"/></linearGradient></defs><g id="dynGrid"></g><path id="idealArea" fill="url(#simArea)"/><path id="idealPath" fill="none" stroke="#3f69df" stroke-width="2.8" stroke-linejoin="round"/><path id="measPath" fill="none" stroke="#eb9160" stroke-width="2.5" stroke-linejoin="round"/><line id="cursorLine" y1="20" y2="222" stroke="#849bb9" stroke-width="1" stroke-dasharray="3 5"/><circle id="idealDot" r="5" fill="#3f69df" stroke="white" stroke-width="2"/><circle id="measDot" r="5" fill="#eb9160" stroke="white" stroke-width="2"/><text x="17" y="17" font-size="10" fill="#7889a2">ANGLE / °</text><text x="879" y="239" font-size="10" fill="#7889a2">TIME →</text></svg>`}
function tempSVG(){return `<svg viewBox="0 0 940 245" aria-label="温度目标、箱温和芯片温度示意曲线"><g id="tempGrid"></g><path id="spPath" fill="none" stroke="#c2a2df" stroke-width="2" stroke-dasharray="6 4"/><path id="pvPath" fill="none" stroke="#eb9661" stroke-width="2.5"/><path id="tcPath" fill="none" stroke="#2e9d92" stroke-width="3"/><text x="12" y="18" font-size="10" fill="#7889a2">TEMP / ℃</text><text x="868" y="239" font-size="10" fill="#7889a2">TIME →</text></svg>`}
function labPage(){return `${pageHeader('可调参数的工程原理演示','示意生成曲线均为合成数据，帮助理解机制；绝非你当前仪器的采样结果。',`<button class="btn soft" data-action="open-config">调整工程方案</button>`)}<div class="panel demo-panel"><div class="panel-header"><div><h3>01 · 常温转台摇摆 → IMU动态角度误差</h3><p>Roll/Pitch装夹映射：Roll内轴0°；Pitch内轴90°，转动外轴进行低风险摇摆。</p></div><div class="headline-actions"><button class="btn sm ${axis==='ROLL'?'primary':''}" data-action="axis-roll">ROLL</button><button class="btn sm ${axis==='PITCH'?'primary':''}" data-action="axis-pitch">PITCH</button></div></div><div class="chartarea">${simSVG()}</div><div class="legend"><span><i style="background:#416be1"></i>转台参考角（模拟）</span><span><i style="background:#ed9460"></i>IMU测量角（模拟，含偏置与滞后）</span><span>刷新滑块即可改波形</span></div><div class="demo-controls"><div class="ctrl"><label>摆幅 <output id="amplitudeVal"></output></label><input data-demo="amplitude" type="range" min="0.5" max="15" step="0.5" value="${H(state.config.amplitude)}"></div><div class="ctrl"><label>摇摆频率 <output id="frequencyVal"></output></label><input data-demo="frequency" type="range" min="0.05" max="1" step="0.05" value="${H(state.config.frequency)}"></div><div class="ctrl"><label>偏置（模拟） <output id="simBiasVal"></output></label><input data-demo="simBias" type="range" min="-0.3" max="0.3" step="0.01" value="${H(state.config.simBias)}"></div><div class="ctrl"><label>滞后（模拟） <output id="simDelayVal"></output></label><input data-demo="simDelay" type="range" min="0" max="250" step="5" value="${H(state.config.simDelay)}"></div></div><div class="twocol"><div class="notice blue"><strong>原理：</strong> 理想角度 θ=A·sin(2πft)；示意测量 θ̂=A·sin[2πf(t−τ)]+b。频率越高、时延越大，动态角度差通常越明显。</div><div class="notice warn"><strong>计算边界：</strong> <span id="simMetrics">正在绘制示意曲线</span>。只对合成曲线计算，与转台精度、IMU实际精度无关。</div></div><p class="demo-note">实机主指标还需真实转台编码器、UID匹配厂标定、完整全运动数据、硬件同步及独立参考；历史离线回放不能替代验收。</p></div><div class="panel demo-panel" style="margin-top:16px"><div class="panel-header"><div><h3>02 · 温控转台：设温 SP、箱温 PV、芯片温度 Tchip</h3><p function configWarnings(){let c=state.config,w=[];let low=+c.tempLow,hi=+c.tempHigh;if(low < -40||hi > 105)w.push('计划温区超出2FDT600WK手册的−40～+105℃；应停止并重新审查，不代表可执行。');if(low>=hi)w.push('最低温必须低于最高温。');if(low<-40||hi>85)w.push('参考R10旧研发文档的产品工作温区−40～+85℃；请核对当前产品规格，温箱能力不等于整机许可。');if(+c.amplitude<=0||+c.frequency<=0||+c.periods<=0)w.push('动态幅值、频率和周期数必须为正数。');if(+c.tempStep<=0||+c.tempCycles<=0)w.push('温度间隔和循环次数必须为正数。');if(2*Math.PI*+c.frequency*+c.amplitude>60)w.push('正弦摇摆峰值速度估算超出2TD-600手册的60°/s角速率范围，不能执行。');if(+c.goalDynamic<=0)w.push('研发目标应为正数，且需明确产品适用工况。');if(!w.length)w.push('当前输入未发现上述简单算术越界；这不表示已通过机械、温度、时基或安全审查。');return w.map(x=>`<div class="metricline"><span class="metricdot" style="background:${w.length===1&&x.startsWith('当前输入')?'#279276':'#d58d53'}"></span><div><p style="font-size:12px">${H(x)}</p></div></div>`).join('')}
function sourcePage(){return `${pageHeader('工程材料依据与事实边界','主要依据此次上传的两份设备手册和两个工程压缩包；其他步骤属于明确标注的工程建议。')}<div class="sources"><div class="source"><span class="pill blue">设备手册 · PDF</span><h3 style="margin-top:8px">《2TD-600 双轴转台使用维护说明书》</h3><p>用于常温转台运动模式、负载20kg、双轴60°/s、角位置精度、安装/防护约束。重点核对手册第4-11页。</p></div><div class="source"><span class="pill orange">设备手册 · DOCX</span><h3 style="margin-top:8px">《2FDT600WK 双轴温控转台使用说明书》</h3><p>用于温箱−40～105℃、双轴速率、负载45kg、RS422/RS232、电源/温度/装夹/安全边界。重点参考技术指标、接口与操作章节。</p></div><div class="source"><span class="pill blue">软件工程 · ZIP</span><h3 style="margin-top:8px">《WK_IMU温补上位机_R10》</h3><p>R10最终说明、固定硬件版、WK常温同工艺对照、28候选温补、PLC写后新鲜回读、热浸和停机未确认判INCOMPLETE。</p></div><div class="source"><span class="pill green">软件工程 · ZIP</span><h3 style="margin-top:8px">《TiltLab V7.16》</h3><p>V7.16无杆臂通用基线、全运动绝对角度误差、缺口/时间诊断和静态安装轴前检。研究候选未取代默认基线。</p></div></div><div class="panel" style="margin-top:16px"><h3>四种结论必须区分</h3><div class="divider"></div><div class="metricline"><span class="metricdot"></span><div><strong>厂家手册中的“设备规格”</strong><p>不是当前设备的计量校准证书，更不是装夹后的整机参考不确定度。</p></div></div><div class="metricline"><span class="metricdot" style="background:#17a5a1"></span><div><strong>源码 / 自动化回归通过</strong><p>能说明部分逻辑被覆盖，不能证明Windows转台、PLC、IMU串口和急停已现场联调。</p></div></div><div class="metricline"><span class="metricdot" style="background:#dba363"></span><div><strong>实验数据和历史只读回放</strong><p>需要声明数据集、算法版本、时间参考、拟合与独立验证是否隔离；不能写成当前实机性能。</p></div></div><div class="metricline"><span class="metricdot" style="background:#d86376"></span><div><strong>正式产品生产放行</strong><p>需要受控工艺、独立参考、跨样本验证、签核、MSA和每台/每批追溯；当前模板不自动执行上述审批。</p></div></div></div><div class="notice warn" style="margin-top:15px"><strong>研发目标声明：</strong> 动态最大绝对角度误差 ≤${H(state.config.goalDynamic)}° 是目标。TiltLab V7.16源文件明确表示尚未完成硬件同步和真实计量确认，也未认证该目标。用户可修改目标，但不能使其自动变成已验证结论。</div>`}

function importData(file){if(!file)return;if(file.size>8*1024*1024){toast('文件过大，超过8MB限制');return}let reader=new FileReader();reader.onload=()=>{try{let o=JSON.parse(String(reader.result));if(!o||!Array.isArray(o.steps)||!o.steps.length||!o.config||!Array.isArray(o.phases))throw Error('文件结构无效');if(!confirm('导入会覆盖当前浏览器里尚未导出的本地进度，是否继续？'))return;state={...fresh(),...o,config:{...INITIAL.config,...o.config}};state.steps=state.steps.map(s=>({...s,log:Array.isArray(s.log)?s.log:[],procedure:Array.isArray(s.procedure)?s.procedure:[],checked:Array.isArray(s.checked)?s.checked:[]}));selectedPhase=state.phases[0]?.id||'P0';selectedStep=state.steps[0]?.id;persist();navigate('home');toast('已导入工程配置与全部步骤')}catch(e){toast('导入失败：不是兼容的流程备份JSON')}};reader.readAsText(file,'utf-8')}

function addNewStep(){let id='N'+Date.now().toString(36).slice(-6).toUpperCase();let s={id,phase:selectedPhase,stage:'研发',name:'新建工艺步骤',equip:'待选择',owner:'待分配',duration:'待评估',goal:'填写这一步要做什么',principle:'填写核心原理和适用条件',scheme:'填写现有设备可执行的方案',procedure:['第一项操作','第二项操作'],gate:'填写需要达到的准入条件',evidence:'填写必须留存的原始数据',output:'填写交付物',risk:'填写安全风险和易错点',source:'待补充',notes:'',approver:'',status:'未开始',approval:'未评审',checked:[],log:[]};state.steps.push(s);selectedStep=id;editing=true;persist();render('flow');toast('已新建可编辑步骤')}
function newLog(){let s=getStep(selectedStep);if(!s)return;let tx=prompt('填写现场记录（执行情况、原始数据目录、故障或后续行动）：');if(tx===null)return;tx=tx.trim();if(!tx)return;let author=state.config.owner||'现场记录';s.log=s.log||[];s.log.unshift({at:tnow(),author,text:tx});persist();render('flow');toast('现场记录已保存')}
function startDynamics(){const svg=$('#idealPath');if(!svg)return;let grid=$('#dynGrid');grid.innerHTML=Array.from({length:9},(_,i)=>{let x=45+i*108;return `<line x1="${x}" y1="22" x2="${x}" y2="220" stroke="#dfe7f3" stroke-width="1"/>`}).join('')+Array.from({length:5},(_,i)=>{let y=26+i*47;return `<line x1="45" y1="${y}" x2="915" y2="${y}" stroke="#dfe7f3" stroke-width="1"/>`}).join('');function frame(){if(currentView!=='lab')return;let c=state.config,am=Math.max(.05,+c.amplitude||5),f=Math.max(.01,+c.frequency||.3),bias=+c.simBias||0,delay=(+c.simDelay||0)/1000;let samples=350,duration=2.8/Math.max(.05,f),base=121,scale=86/Math.max(1,am);let a=[],b=[],errs=[];for(let i=0;i<=samples;i++){let x=45+(870*i/samples),t=duration*i/samples;let ref=am*Math.sin(2*Math.PI*f*t),measure=am*Math.sin(2*Math.PI*f*(t-delay))+bias;let y=base-ref*scale,z=base-measure*scale;a.push(`${i?'L':'M'}${x.toFixed(1)},${y.toFixed(1)}`);b.push(`${i?'L':'M'}${x.toFixed(1)},${z.toFixed(1)}`);errs.push(Math.abs(ref-measure))}$('#idealPath').setAttribute('d',a.join(' '));$('#measPath').setAttribute('d',b.join(' '));$('#idealArea').setAttribute('d',a.join(' ')+` L915,220 L45,220 Z`);let t=(Date.now()-simStart)/1000 % duration;let x=45+870*t/duration,ref=am*Math.sin(2*Math.PI*f*t),measure=am*Math.sin(2*Math.PI*f*(t-delay))+bias;$('#cursorLine').setAttribute('x1',x);$('#cursorLine').setAttribute('x2',x);$('#idealDot').setAttribute('cx',x);$('#idealDot').setAttribute('cy',base-ref*scale);$('#measDot').setAttribute('cx',x);$('#measDot').setAttribute('cy',base-measure*scale);['amplitude','frequency','simBias','simDelay'].forEach(k=>{let el=$('#'+k+'Val');if(el)el.textContent=k==='amplitude'?N(am,1)+'°':k==='frequency'?N(f,2)+'Hz':k==='simBias'?N(bias,2)+'°':Number(c.simDelay)+'ms'});let max=Math.max(...errs),rmse=Math.sqrt(errs.reduce((sum,x)=>sum+x*x,0)/errs.length);$('#simMetrics').innerHTML=`本示例 max |误差|≈ <b>${N(max,3)}°</b>，RMSE≈ <b>${N(rmse,3)}°</b>。${max<=+state.config.goalDynamic?'本合成示例低于设定目标':'本合成示例高于设定目标'}；均非实测数据。`;simFrame=requestAnimationFrame(frame)}frame()}
function drawTemp(){if(currentView!=='lab')return;let c=state.config,low=+c.tempLow,high=+c.tempHigh,room=+c.roomTemp||25,fac=Math.max(1,+c.tempInertia||23),min=Math.min(low,room,high)-12,max=Math.max(low,room,high)+12,rng=Math.max(max-min,10),n=400;let grid=$('#tempGrid');if(!grid)return;grid.innerHTML=Array.from({length:8},(_,i)=>{let x=47+i*123;return `<line x1="${x}" y1="19" x2="${x}" y2="220" stroke="#e1e9f4"/>`}).join('')+Array.from({length:5},(_,i)=>{let y=22+i*48;return `<line x1="47" y1="${y}" x2="920" y2="${y}" stroke="#e1e9f4"/><text x="7" y="${y+3}" font-size="10" fill="#8594a8">${N(max-i*(rng/4),0)}</text>`}).join('');let targets=[room,low,low,high,high,low,low,room,room];let sp=[],pv=[],chip=[],a=room,b=room;let coeff=1/(7+fac*.23),ccoeff=1/(12+fac*.45);for(let i=0;i<=n;i++){let loc=i/n*(targets.length-1),ii=Math.floor(loc);let target=targets[Math.min(ii,targets.length-1)];a+=coeff*(target-a);b+=ccoeff*(a-b);let x=47+i/n*873;let Y=v=>220-(v-min)/rng*196;sp.push(`${i?'L':'M'}${x.toFixed(1)},${Y(target).toFixed(1)}`);pv.push(`${i?'L':'M'}${x.toFixed(1)},${Y(a).toFixed(1)}`);chip.push(`${i?'L':'M'}${x.toFixed(1)},${Y(b).toFixed(1)}`)}$('#spPath').setAttribute('d',sp.join(' '));$('#pvPath').setAttribute('d',pv.join(' '));$('#tcPath').setAttribute('d',chip.join(' '));['tempLow','tempHigh','tempInertia','soakSeconds'].forEach(k=>{let e=$('#'+k+'Val');if(e)e.textContent=k==='soakSeconds'?N(+c[k]/60,0)+'min':k==='tempInertia'?String(c[k]):c[k]+'℃'})}

document.addEventListener('click',e=>{let nav=e.target.closest('[data-view]');if(nav){navigate(nav.dataset.view);return}let b=e.target.closest('[data-action]');if(!b)return;let action=b.dataset.action;switch(action){case 'choose-phase':selectedPhase=b.dataset.phase;selectedStep=state.steps.find(s=>s.phase===selectedPhase)?.id;editing=false;navigate('flow');break;case 'filter-phase':selectedPhase=b.dataset.phase;selectedStep=state.steps.find(s=>s.phase===selectedPhase)?.id;editing=false;render('flow');break;case 'select-step':selectedStep=b.dataset.step;editing=false;render('flow');break;case 'open-step':openStep(b.dataset.step);break;case 'open-flow':navigate('flow');break;case 'open-config':navigate('config');break;case 'new-step':addNewStep();break;case 'toggle-edit':editing=!editing;render('flow');break;case 'duplicate-step':duplicate();break;case 'move-up':moveStep(-1);break;case 'move-down':moveStep(1);break;case 'delete-step':{let s=getStep(selectedStep);if(s&&confirm(`确认永久删除步骤“${s.name}”？请先导出备份。`)){state.steps=state.steps.filter(x=>x.id!==selectedStep);selectedStep=state.steps.find(x=>x.phase===selectedPhase)?.id;editing=false;persist();render('flow');toast('步骤已删除')}break}case 'add-log':newLog();break;case 'axis-roll':axis='ROLL';render('lab');break;case 'axis-pitch':axis='PITCH';render('lab');break;case 'export':exportData();break;case 'import':$('#fileInput').click();break;case 'reset-all':if(confirm('确定恢复最初的52步模板？当前步骤编辑、状态与日志将全部清除，且不能撤销。')){state=fresh();selectedPhase='P0';selectedStep='R01';editing=false;persist();navigate('home');toast('已恢复初始模板')}break;}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='stepStatus'){let s=getStep(selectedStep);if(s){s.status=el.value;persist();render('flow');toast('状态已记录；不代表精度验收')}return}if(el.id==='stepApproval'){let s=getStep(selectedStep);if(s){s.approval=el.value;persist();render('flow');toast('评审状态已登记；正式签核需外部证据')}return}if(el.id==='statusFilter'){statusFilter=el.value;render('flow');return}if(el.dataset.checkIndex!==undefined){let s=getStep(selectedStep);if(!s)return;let i=+el.dataset.checkIndex;s.checked=s.checked||[];s.checked=el.checked?[...new Set([...s.checked,i])]:s.checked.filter(x=>x!==i);persist();render('flow');return}if(el.dataset.demo){let k=el.dataset.demo;state.config[k]=Number(el.value);persist();if(['tempLow','tempHigh','tempInertia','soakSeconds'].includes(k))drawTemp();return}});
document.addEventListener('input',e=>{if(e.target.id==='stepSearch'){let pos=e.target.selectionStart;searchText=e.target.value;let s=document.querySelector('.steplist');if(s){let filtered=state.steps.filter(st=>st.phase===selectedPhase&&(!searchText||(st.name+' '+st.goal+' '+st.id).toLowerCase().includes(searchText.toLowerCase()))&&(statusFilter==='全部'||st.status===statusFilter));s.innerHTML=filtered.length?filtered.map(st=>`<button class="stepitem ${st.id===selectedStep?'active':''}" data-action="select-step" data-step="${H(st.id)}"><span class="stepitem-id">${H(st.id)}</span><span class="stepitem-main"><strong>${H(st.name)}</strong><small>${H(st.equip)}</small></span><span class="statebadge ${H(st.status)}">${H(st.status)}</span></button>`).join(''):'<div class="empty">没有符合条件的步骤</div>';}return}if(e.target.dataset.demo){let k=e.target.dataset.demo;state.config[k]=Number(e.target.value);persist();if(['tempLow','tempHigh','tempInertia','soakSeconds'].includes(k))drawTemp();}});
document.addEventListener('submit',e=>{if(e.target.id==='editForm'){e.preventDefault();let s=getStep(selectedStep);if(!s)return;let fd=new FormData(e.target);for(let [k,v] of fd.entries()){if(k==='procedure'){s.procedure=String(v).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);s.checked=[]}else{s[k]=String(v)}}selectedPhase=s.phase;editing=false;persist();render('flow');toast('步骤内容已保存');return}if(e.target.id==='configForm'){e.preventDefault();const fd=new FormData(e.target);for(let [k,v] of fd.entries()){let before=INITIAL.config[k];state.config[k]=typeof before==='number'?(v===''?before:Number(v)):String(v)}persist();render('config');toast('方案变量已保存');return}});
$('#exportBtn').addEventListener('click',exportData);$('#importBtn').addEventListener('click',()=>$('#fileInput').click());$('#fileInput').addEventListener('change',e=>{importData(e.target.files[0]);e.target.value=''});$('#printBtn').addEventListener('click',()=>window.print());
render('home');if(!saveOK)toast('浏览器未允许本地存储，请使用导出JSON备份');

</script>
