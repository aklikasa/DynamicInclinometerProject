/* Product definition matrix: read without entering edit mode */
.cell-expand{appearance:none;display:block;width:100%;padding:3px 4px;margin:-3px -4px;border:0;border-radius:7px;background:transparent;color:inherit;text-align:left;white-space:normal;cursor:pointer;font-weight:inherit;font-size:inherit;line-height:1.5}
.cell-expand:hover,.cell-expand:focus-visible{background:#edf7fb;outline:1px solid #cce7f0}
.cell-expand .truncate3{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;white-space:pre-wrap}
.cell-expand.expanded .truncate3{display:block;-webkit-line-clamp:unset;overflow:visible;white-space:pre-wrap;overflow-wrap:anywhere}
.expand-hint{display:inline-block;font-size:11px;font-weight:700;color:#1b8196;margin-top:5px}
.cell-expand.expanded .expand-hint{color:#6c8098}
.readonly-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.readonly-field{padding:13px 14px;background:#f8fafc;border:1px solid #e5edf3;border-radius:10px;min-width:0}
.readonly-field.full{grid-column:1/-1}
.readonly-field .rf-label{font-size:11px;font-weight:750;color:#60738e;margin-bottom:6px}
.readonly-field .rf-value{font-size:13px;line-height:1.75;color:#21334b;white-space:pre-wrap;overflow-wrap:anywhere}
.readonly-photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.readonly-photo-grid figure{margin:0;border:1px solid #e1e9f1;padding:7px;border-radius:9px}
.readonly-photo-grid img{width:100%;height:120px;object-fit:contain}
.readonly-photo-grid figcaption{font-size:11px;color:#718199;overflow-wrap:anywhere}
@media(max-width:760px){.readonly-grid{grid-template-columns:1fr}}

首版100Hz与200Hz升级路线采用何种区分？200Hz是否首版验收要求？","owner":"杜峥 / 吴徐宏","priority":"P0","related":"R06","status":"已确认","answer":"已定：首版100Hz；200Hz属于后续升级版本，不纳入首版出厂门槛。","updatedAt":""},{"id":"Q04","category":"结构冻结","question":"DTS机壳尺寸、重量≤200g、安装孔位、M12接头型号/针数何时冻结？","owner":"郑胜义 / 吴徐宏","priority":"P0","related":"R14","status":"已确认","answer":"已定目标：外壳包络≤72×47×22.5mm，4×M4参考64×39×6.5mm，重量≤200g（不含线束），采用M12 5针；产品制造尺寸须按DTS图纸检测。","updatedAt":""},{"id":"Q05","category":"工业接口","question":"CAN/CANopen是首版必需还是后续型号？4–20mA、航向/三轴姿态是否仅预留？","owner":"杜峥 / 张肖汉","priority":"P0","related":"R16","status":"已确认","answer":"已定：首版RS485/Modbus RTU；CAN/CANopen、4～20mA及航向为扩展配置，不属于首版必要项。","updatedAt":""},{"id":"Q06","category":"全温精度","question":"-40～85℃温漂残差、温滞与冷启动稳定时间的内部合格限值是什么？","owner":"杜峥 / 王立群","priority":"P0","related":"R08","status":"已确认","answer":"已定：-40～+85℃工作，零点温度系数≤±0.01°/℃，灵敏度温度系数≤100ppm/℃；试验点-40/-20/0/25/50/70/85℃。","updatedAt":""},{"id":"Q07","category":"可靠性规范","question":"1000g@1ms的次数、冲击后性能变化、10grms随机振动谱/时长及样本量采用何种制定？","owner":"钟启华 / 王立群","priority":"P0","related":"R12","status":"已确认","answer":"已定工程试验：1000g@1ms半正弦，三轴正/负各3次；振动≥10grms、10～1000Hz，每轴2h；整机试后复测角度与通信。","updatedAt":""},{"id":"Q08","category":"EMC/协议","question":"GB/T17626/EN61000的项目和等级、Modbus寄存器表与错误码什么时候定版？","owner":"吴徐宏 / 张肖汉","priority":"P1","related":"R30","status":"已确认","answer":"已定工程EMC测试项目与等级见R30；Modbus通信参数与数据字典要求见R20/R34，需随软件版本归档实现证据。","updatedAt":""},{"id":"Q09","category":"资源与计划","question":"为什么§4.3开发计划止于2026-09，而基本信息计划完成日期为2026-12-31？10–12月里程碑是否缺失？","owner":"杜峥","priority":"P0","related":"","status":"已确认","answer":"工作计划按原有里程碑保留；2026-12-31为计划完成日。后续进度是否实际达到须按项目看板真实更新，本页不虚构完成记录。","updatedAt":""},{"id":"Q10","category":"人员姓名","question":"生产/安装责任人应写“马紫阳”还是“马紫样”？内部立项资料内部两处写法不同。","owner":"杜峥","priority":"P1","related":"","status":"已关闭","answer":"技术资料中的生产人员姓名存在写法差异，作为行政信息待人事资料核对，不影响DTS产品目标的已确认状态。","updatedAt":""},{"id":"Q11","category":"立项签审","question":"封面申请2026-09-30、基本信息表2026-10-08；哪个为流程生效日期？资料审批签字是否完成？","owner":"杜峥","priority":"P1","related":"","status":"已关闭","answer":"封面与基本信息页申请日期有差异，原始文件日期均保留；实际生效日由审批流程记录确定，不作为DTS性能指标。","updatedAt":""},{"id":"Q12","category":"商务与物料","question":"目标单台BOM成本/售价、首批需求量、关键IMU型号及第二供应源何时确认？","owner":"杜峥 / 吴徐宏","priority":"P1","related":"R39","status":"已确认","answer":"已定：BOM按100台、500台建立两档成本表，单台BOM≤不含税售价40%；具体人民币成本/报价以实际采购价格填报，禁止编造。","updatedAt":""},{"id":"Q13","category":"文件交付","question":"PC调试/标定工具和云平台功能是否全部首版交付？验收清单是什么？","owner":"张肖汉 / 杨瑞贲","priority":"P1","related":"R35","status":"已确认","answer":"已定：Windows PC工具首版包含实时曲线、配置、校准、CSV导出和升级；云平台按项目配套独立验证。","updatedAt":""},{"id":"Q14","category":"竞品订货规格","question":"HDA436T和SST810对标的具体订货配置、最新手册修订号与动态测试口径是否有实物复测？","owner":"杜峥 / 王立群","priority":"P1","related":"R47","status":"已确认","answer":"已定对标基线：瑞芬HDA436T官网公开规格、辉格SST810按具体选配档；同工况比较，采购版本/实物精度仍用验证结果记录。","updatedAt":""}],"competitors":[{"id":"rion","name":"瑞芬 HDA436T","model":"HDA436T 系列（详见订货版本）","description":"依据内部立项 V2.2，精度统计口径与版本必须核对","sourceId":"rion","photoId":"rion"},{"id":"vigor","name":"辉格 SST810","model":"SST810 系列（不同选配档位）","description":"不同手册版本的精度与刷新率不同，比较时应注明来源","sourceId":"vigor","photoId":"vigor"}]}</script>

ection">优先冻结的核心需求</div><div class="bullet-card">${rows||'<div class="empty">暂无核心需求</div>'}</div><div class="action-row" style="margin-top:17px"><button class="btn btn-small" data-action="addItem">＋ 新增定义要素</button><button class="btn btn-small" data-view="verification">查看验证方案 →</button></div></section></div><div class="section-head"><div><h2>竞品研发基线</h2><p>对标同时参考内部内部立项资料和厂商公开资料；需统一选配、版本和工况。</p></div><button class="btn btn-small" data-view="comparison">查看全部 ${state.comparisons.length} 项对标 →</button></div><div class="reference-panel">${renderProductRef('rion','瑞芬科技 · HDA436T','动态精度 ±0.1° RMS @25℃','静态精度 ±0.05° · 0.01°分辨率')}${renderProductRef('vigor','辉格科技 · SST810','动态精度按选配 ±1° 至 ±0.02°','新版官网最高200Hz数字更新率')}</div><details class="risk-details"><summary>⚑ 待解决与待评审事项 · ${pending.length} 项预览（默认收起，点击展开）</summary><div class="riskcontent">${pending.length?pending.map(i=>`<div class="bullet-line" data-edit="${esc(i.id)}"><span class="bull"></span><div style="flex:1"><strong>${esc(i.name)}</strong><small>${esc(shorten(i.issue||i.action||'尚未填写问题说明'))}</small></div>${badgeStatus(i.status)}</div>`).join(''):'<div class="empty">当前没有登记为待评审或阻塞的定义要素。</div>'}<div style="margin-top:12px"><button class="btn btn-small" data-view="risks">查看集中问题清单 →</button></div></div></details><div class="note-box warning-box" style="margin-top:17px"><strong>对标注意：</strong> 瑞芬 HDA436T 标注动态 ±0.1° RMS@25℃；辉格 SST810 为不同选配档位，部分历史资料写1000Hz、最新版官网写最高200Hz数字更新。不能把“刷新率、响应时间和测量带宽”视为同一指标。冲击 100g@11ms 和 1000g@1ms 也不能只比较 g 值。<button class="linktext" data-view="sources">查看证据来源 ↗</button></div>`}

function renderRequirements(){let base=state.items.filter(i=>(modFilter==='all'||i.moduleId===modFilter)&&(statusFilter==='all'||(statusFilter==='withtarget'?!!(i.target||'').trim():statusFilter==='已确认'?(i.status==='已确认'||i.status==='已验证'):i.status===statusFilter))&&(priorityFilter==='all'||i.priority===priorityFilter)&&((i.name+i.definition+i.target+i.benchRion+i.benchVigor+i.issue+i.owner).toLowerCase().includes(searchTerm.toLowerCase())));return `<div class="section-head"><div><h2>产品定义要素矩阵</h2><p>从 Excel 原始 48 项建立，可新增、调整模块和修改全部参数。点击文字可展开全文，或点“查看”阅读完整详情；编辑仅用于修改。</p></div><div class="action-row"><button class="btn btn-small" data-action="manageModules">管理模块</button><button class="btn btn-primary btn-small" data-action="addItem">＋ 新增定义项</button><button class="btn btn-small" data-action="exportCSV">导出 CSV</button></div></div><div class="panel"><div class="toolbar"><input class="search" id="req-search" placeholder="搜索名称、目标、竞品参数、负责人、问题…" value="${esc(searchTerm)}"><div class="action-row"><select class="select" id="req-status">${opts(['all','待定义','草拟中','待评审','已确认','已验证','阻塞','withtarget'],statusFilter).replace('<option value="all"','<option value="all"')}</select><select class="select" id="req-priority">${opts(['all','P0','P1','P2'],priorityFilter)}</select></div><span class="muted small">筛选结果 ${base.length} / ${state.items.length}</span></div><div class="tablewrap"><table class="req-table"><thead><tr><th>编号 / 模块</th><th>定义要素</th><th>瑞芬 HDA436T</th><th>辉格 SST810</th><th>DTS 系列目标</th><th>优先级</th><th>状态</th><th>操作</th></tr></thead><tbody>${base.map(i=>`<tr><td><b>${esc(i.id)}</b><div class="muted tiny">${esc(moduleName(i.moduleId))}</div></td><td><button class="linktext" data-view-item="${esc(i.id)}" title="查看只读详情">${esc(i.name)}</button><div class="tiny muted">${expandableCell(i.definition)}</div></td><td>${expandableCell(i.benchRion)}${i.sourceRion?`<div class="tiny">${sourceLink(i.sourceRion)}</div>`:''}</td><td>${expandableCell(i.benchVigor)}${i.sourceVigor?`<div class="tiny">${sourceLink(i.sourceVigor)}</div>`:''}</td><td>${expandableCell(i.target)}${i.target?`<span class="tag ${i.targetLevel==='已冻结'?'ready':'warn'}">${esc(i.targetLevel)}</span>`:''}</td><td><span class="tag ${esc(i.priority.toLowerCase())}">${esc(i.priority)}</span></td><td>${badgeStatus(i.status)}</td><td><div class="action-row"><button class="btn btn-small" data-view-item="${esc(i.id)}">查看</button><button class="btn btn-small" data-edit="${esc(i.id)}">编辑</button></div></td></tr>`).join('')||`<tr><td colspan="8"><div class="empty"><strong>没有匹配的定义项</strong>清除筛选或新增需求。<div style="margin-top:12px"><button class="btn btn-small" data-action="clearFilters">清空筛选</button></div></div></td></tr>`}</tbody></table></div></div><p class="hintline" style="margin-top:12px">状态“已确认/已验证”必须由项目负责人根据评审和原始测试证据更新；系统不会因为填写了目标就自动认定规格已达标。</p>`}
function renderComparison(){return `<div class="section-head"><div><h2>竞品基准 · 17 个关键工程指标（立项目标版）</h2><p>对标基准是公开可查的厂家数据，注意版本、量程、工况、统计口径及订货选项。</p></div><div class="action-row"><button class="btn btn-small" data-view="sources">查看全部来源</button><button class="btn btn-primary btn-small" data-action="addCompare">＋ 新增对标指标</button></div></div><div class="note-box warning-box" style="margin-bottom:16px"><strong>型号提示：</strong> 用户所称“HDA436”在公开官网对应 HDA436T 系列；“竹格 SST810”在厂家资料中的名称为「辉格科技（Vigor Technology）」。SST810 新旧资料对刷新率及精度选项描述存在差异，须索取相应订货型号/最新规格书后确认。</div><div class="panel"><div class="tablewrap"><table class="compare-table"><thead><tr><th>工程指标</th><th>瑞芬 HDA436T</th><th>辉格 SST810</th><th>DTS 系列产品基线 / 待冻结项（可编辑）</th><th>注意事项 / 版本差异</th><th>操作</th></tr></thead><tbody>${state.comparisons.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.rion||'待核实')}<div class="tiny">${sourceLink(c.rionSource)}</div></td><td>${esc(c.vigor||'待核实')}<div class="tiny">${sourceLink(c.vigorSource)}</div></td><td><span class="tag warn">建议目标</span><div style="margin-top:5px">${esc(c.target||'待定义')}</div></td><td><span class="small muted">${esc(c.note||'—')}</span></td><td><button class="btn btn-small" data-edit-compare="${esc(c.id)}">编辑</button></td></tr>`).join('')}</tbody></table></div></div><div style="margin-top:12px" class="note-box">特别说明：SST810 历史中文资料宣称 1000Hz 更新/≤5ms 延迟，历史英文资料列出最高400Hz，新版厂家官网列出最高200Hz数字更新率。请按版本留痕，不应在同一对标行中视为统一值。</div>`}
function renderVerification(){let total=state.tests.length,pass=state.tests.filter(t=>t.status==='已通过').length;return `<div class="section-head"><div><h2>研发验证与验收计划</h2><p>依据立项V2.2建立的试验清单；资料未明确的测试条件和判定口径仍需评审。</p></div><button class="btn btn-primary btn-small" data-action="addTest">＋ 新增验证项</button></div><div class="panel panel-pad"><div class="action-row" style="justify-content:space-between"><div><b>${pass} / ${total}</b> <span class="muted small">测试项标记为已通过</span></div><select id="test-status" class="select">${opts(['all','未规划','计划中','进行中','已通过','未通过'],testFilter)}</select></div><div class="accentline"><i style="width:${total?Math.round(pass/total*100):0}%"></i></div></div><div class="panel" style="margin-top:14px"><div class="tablewrap"><table style="min-width:850px"><thead><tr><th>试验编号</th><th>试验主题</th><th>方法与设备</th><th>验收口径（草案）</th><th>负责人</th><th>状态</th><th>记录</th></tr></thead><tbody>${state.tests.filter(t=>testFilter==='all'||t.status===testFilter).map(t=>`<tr><td><b>${esc(t.id)}</b></td><td><button class="linktext" data-edit-test="${esc(t.id)}">${esc(t.title)}</button></td><td>${esc(shorten(t.method,85))}</td><td>${esc(shorten(t.criterion,82))}</td><td>${esc(t.owner||'待指定')}</td><td>${badgeStatus(t.status)}</td><td><button class="btn btn-small" data-edit-test="${esc(t.id)}">编辑 / 附件</button></td></tr>`).join('')||`<tr><td colspan="7" class="empty">暂无匹配试验。</td></tr>`}</tbody></table></div></div>`}
function renderRisks(){let items=state.items.filter(i=>i.status==='阻塞'||(i.issue||'').trim()||i.status==='待评审');let todo=state.items.filter(i=>i.status==='待定义'||i.status==='草拟中');return `<div class="section-head"><div><h2>风险与决策集中清单</h2><p>自动汇总阻塞、已有问题说明和待评审需求；点击直接进入详情。</p></div><button class="btn btn-small" data-view="requirements">返回定义矩阵</button></div><div class="split-grid"><div class="panel panel-pad"><div class="subsection">当前待决策 / 问题项 <span class="tag ${items.length?'warn':'ready'}">${items.length}</span></div>${items.length?items.map(i=>`<div class="bullet-line" data-edit="${esc(i.id)}"><span class="bull" style="background:${i.status==='阻塞'?'#c24b5d':'#e6a34c'}"></span><div style="flex:1"><strong>${esc(i.name)}　${badgeStatus(i.status)}</strong><small>${esc(moduleName(i.moduleId))} · ${esc(i.owner||'负责人未指定')}</small><p class="small" style="margin:5px 0 0;color:#526884">${esc(shorten(i.issue||i.action||'未填写具体待决策说明',110))}</p></div></div>`).join(''):'<div class="empty"><strong>暂无登记的问题</strong>将需求设为待评审或阻塞，或填写问题说明即可汇总。</div>'}</div><div class="panel panel-pad"><div class="subsection">尚需完善的定义项 <span class="tag">${todo.length}</span></div>${todo.slice(0,13).map(i=>`<div class="bullet-line" data-edit="${esc(i.id)}"><span class="bull" style="background:#a9b9c9"></span><div style="flex:1"><strong>${esc(i.name)}</strong><small>${esc(moduleName(i.moduleId))}${i.target?' · 已有草案':' · 目标空白'}</small></div>${badgeStatus(i.status)}</div>`).join('')||'<div class="empty">全部已进入评审或确认阶段</div>'}${todo.length>13?`<button class="btn btn-small" data-view="requirements" style="margin-top:12px">其余 ${todo.length-13} 项查看定义矩阵</button>`:''}</div></div><div class="section-head"><div><h2>规格决策与修改历史</h2><p>需求编辑页的“记录一条决策”会汇总于此。</p></div></div><div class="panel panel-pad">${state.decisions.length?state.decisions.slice().reverse().map(d=>`<div style="padding:12px 4px;border-bottom:1px solid #e9edf3"><b>${esc(d.title)}</b> <span class="muted small">${esc(d.date||'')} · ${esc(d.by||'未署名')}</span><div class="small" style="color:#536780;margin-top:4px">${esc(d.text)}</div></div>`).join(''):'<div class="empty"><strong>尚无正式决策日志</strong>在任何定义要素编辑窗口填写决策记录，即可形成追溯。</div>'}</div>`}
function renderSources(){return `<div class="section-head"><div><h2>竞品资料与工程证据</h2><p>来源链接联网可打开；本 HTML 的数据、编辑和自绘示意图无需网络。</p></div><button class="btn btn-small" data-view="comparison">返回对标矩阵</button></div><div class="note-box warning-box" style="margin-bottom:17px"><strong>版本风险：</strong> 当前使用的 HDA436T 数据来自瑞芬官网及 V2.6 技术手册；SST810 使用辉格新版官网，并将历史规格书仅作为版本差异参考。技术参数应以采购的具体型号、供货合同和厂商盖章规格书为准。</div><div class="sources-grid">${state.sources.map(s=>`<div class="sourcecard panel"><span class="tag ${s.type.includes('官网')?'ready':'neutral'}">${esc(s.type)}</span><h3>${esc(s.name)}</h3><p><b>${esc(s.version||'')}</b></p><p>${esc(s.note||'')}</p>${s.url?`<p><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer" class="anchorlink">查看原始资料 ↗</a></p>`:`<p class="muted">内部上传文档：请在本地打开原 DOCX 核对页码</p>`}<div class="hintline" style="overflow-wrap:anywhere">${esc(s.url)}</div></div>`).join('')}</div><div class="section-head"><div><h2>产品外观参考图</h2><p>尺寸参考图提取自上传的内部立项资料V2.2，已嵌入HTML可离线查阅；可放大、替换或删除。最终机械设计以批准图纸为准。</p></div></div><div class="reference-panel">${renderProductRef('rion','瑞芬 HDA436T','厂家公开资料中为金属壳体与M12接口','外观仅用于识别，不作机械尺寸依据')}${renderProductRef('vigor','辉格 SST810','厂家公开资料中为金属壳体与M12接口','外观仅用于识别，不作机械尺寸依据')}</div>`}
function field(name,label,value,opts={}){let v=esc(value??'');let data=opts.multiline?`<textarea name="${name}" rows="${opts.rows||3}" placeholder="${esc(opts.placeholder||'')}">${v}</textarea>`:opts.list?`<select name="${name}">${opts.list.map(o=>`<option value="${esc(o.value??o)}" ${(o.value??o)===(value??'')?'selected':''}>${esc(o.label??o)}</option>`).join('')}</select>`:`<input type="${opts.type||'text'}" name="${name}" value="${v}" placeholder="${esc(opts.placeholder||'')}">`;return `<div class="field"><label>${esc(label)}</label>${data}</div>`}
function showModal(title,body,footer='',large=false){document.getElementById('dialog-layer').innerHTML=`<div class="modal-wrap" id="modalWrap"><div class="modal ${large?'large':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalbar"><h2>${esc(title)}</h2><button class="btn btn-small" data-action="closeModal">✕ 关闭</button></div>${body}${footer}</div></div>`}
function closeModal(){document.getElementById('dialog-layer').innerHTML='';editId=null;editingTestId=null}
function optionsModule(cur){return state.modules.map(m=>({value:m.id,label:m.title}))}
function openItem(rid){let it=state.items.find(i=>i.id===rid);if(!it)return;editId=rid;let newitem=!!it.__new;let body=`<form id="itemForm" class="modalbody"><div class="fields2">${field('name','定义要素名称',it.name)}${field('moduleId','所属模块',it.moduleId,{list:optionsModule(it.moduleId)})}</div><div class="fields3">${field('priority','优先级',it.priority,{list:['P0','P1','P2']})}${field('status','当前状态',it.status,{list:['待定义','草拟中','待评审','已确认','已验证','阻塞']})}${field('targetLevel','目标成熟度',it.targetLevel||'建议目标',{list:['建议目标','方案评审中','已冻结']})}</div><div class="fields2">${field('owner','负责人',it.owner||'')}${field('due','预计完成日期',it.due||'',{type:'date'})}</div><div class="modal-section">原表定义与本产品目标</div>${field('definition','要素说明（来自上传 Excel，可修改）',it.definition,{multiline:true,rows:2})}${field('examples','原表示例 / 考虑点',it.examples,{multiline:true,rows:2})}${field('target','DTS 系列目标规格与验收口径（草案/已冻结）',it.target,{multiline:true,rows:3})}${field('reportRef','内部立项资料溯源章节 / 页码',it.reportRef||'')}${field('actual','当前实际测试结果（仅填写已获证据的数据）',it.actual,{multiline:true,rows:2})}<div class="modal-section">竞品对标 / 资料索引</div><div class="fields2">${field('benchRion','瑞芬 HDA436T 参考参数',it.benchRion,{multiline:true})}${field('benchVigor','辉格 SST810 参考参数',it.benchVigor,{multiline:true})}</div><div class="fields2">${field('sourceRion','瑞芬数据来源',it.sourceRion||'',{list:[{value:'',label:'未确认'},...state.sources.map(s=>({value:s.id,label:s.name}))]})}${field('sourceVigor','辉格数据来源',it.sourceVigor||'',{list:[{value:'',label:'未确认'},...state.sources.map(s=>({value:s.id,label:s.name}))]})}</div>${field('benchNote','版本差异与比较限制',it.benchNote,{multiline:true,rows:2})}<div class="modal-section">验证计划、问题闭环与附件</div>${field('verification','建议验证方法 / 测试工况',it.verification,{multiline:true})}${field('acceptance','确认后的合格判据',it.acceptance,{multiline:true})}<div class="fields2">${field('issue','未解决问题 / 阻塞原因',it.issue,{multiline:true})}${field('action','解决措施 / 下一步计划',it.action,{multiline:true})}</div>${field('notes','补充说明与会议结论',it.notes,{multiline:true,rows:2})}<div class="modal-section">技术图 / 测试曲线 / 产品照片　<span class="muted tiny">图片支持替换、删除；先自动压缩再保存</span></div><div id="itemPhotos">${galleryHtml(it,'item')}</div><div class="action-row"><button type="button" class="btn btn-small" data-action="uploadItemPhoto">＋ 上传图片</button><span class="hintline">建议每项≤6张。上传前会先保存当前表单字段。</span></div><div class="modal-section">决策留痕（可选）</div>${field('decisionText','本次决策记录：为何修改、由谁批准、哪些条件仍未确定', '',{multiline:true,rows:2,placeholder:'填写后点击“保存修改”，将自动归入决策记录'})}<div class="history">${(it.logs||[]).slice(-6).reverse().map(l=>`<div>${esc(l.date)} · ${esc(l.text)}</div>`).join('')}</div></form>`;let footer=`<div class="modalfooter"><div class="action-row"><button class="btn btn-danger btn-small" data-action="deleteItem" data-id="${esc(it.id)}">删除此项</button><span class="muted tiny">${esc(it.id)}</span></div><button type="submit" form="itemForm" class="btn btn-primary">保存修改并更新统计</button></div>`;showModal(it.name||'新增定义项',body,footer,true)}
function galleryHtml(rec,kind){let ph=rec.photos||[];if(!ph.length)return '<div class="note-box" style="margin:12px 0">暂无配图。可上传原理图、工程照片、转台曲线、校准记录截图等；图片将随HTML快照一同保存。</div>';return `<div class="photo-grid">${ph.map((p,idx)=>`<div class="photo-tile"><img src="${p.data}" alt="${esc(p.name||'照片')}"><div class="tiny muted">${esc(shorten(p.name,16)||'图片')}</div><div class="photo-actions"><button type="button" class="btn btn-small" data-action="replacePhoto" data-kind="${kind}" data-index="${idx}">替换</button><button type="button" class="btn btn-danger btn-small" data-action="deletePhoto" data-kind="${kind}" data-index="${idx}">删除</button></div></div>`).join('')}</div>`}
function saveItemForm(quit=true){let form=document.getElementById('itemForm');if(!form||!editId)return;let it=state.items.find(i=>i.id===editId);if(!it)return;let d=new FormData(form),prev=it.status;for(let key of ['name','moduleId','priority','status','targetLevel','owner','due','definition','examples','target','actual','benchRion','benchVigor','sourceRion','sourceVigor','benchNote','verification','acceptance','issue','action','notes','reportRef'])it[key]=String(d.get(key)||'').trim();if(!it.name){toast('要素名称不能为空');return false}if(!state.modules.some(m=>m.id===it.moduleId)){toast('请先创建模块');return false}let dec=String(d.get('decisionText')||'').trim();if(dec){state.decisions.push({id:id(),itemId:it.id,title:it.name,by:it.owner,date:new Date().toLocaleString('zh-CN'),text:dec});it.logs.push({date:new Date().toLocaleString('zh-CN'),text:dec})}else if(prev!==it.status){it.logs.push({date:new Date().toLocaleString('zh-CN'),text:`状态由 ${prev} 更改为 ${it.status}`})}if(state.decisions.length>500)state.decisions=state.decisions.slice(-500);updated();if(quit){closeModal();render();toast('定义项已保存')}return true}
function addItem(){if(!state.modules.length){toast('请先新增至少一个模块');manageModules();return}let it={id:id(),moduleId:modFilter==='all'?state.modules[0].id:modFilter,name:'新定义项',definition:'',examples:'',target:'',targetLevel:'建议目标',actual:'',benchRion:'',benchVigor:'',benchNote:'',sourceRion:'',sourceVigor:'',priority:'P2',status:'待定义',owner:'',due:'',verification:'',acceptance:'',issue:'',action:'',notes:'',photos:[],logs:[],createdAt:now()};state.items.push(it);updated();render();openItem(it.id)}
function deleteItem(iid){let it=state.items.find(x=>x.id===iid);if(!it||!confirm(`确认永久删除“${it.name}”？导出旧备份前无法撤销。`))return;state.items=state.items.filter(x=>x.id!==iid);updated();closeModal();render();toast('定义项已删除')}
function openCompare(cid){let c=state.comparisons.find(x=>x.id===cid);if(!c)return;let body=`<form class="modalbody" id="compForm">${field('name','对标指标',c.name)}<div class="fields2">${field('rion','瑞芬指标',c.rion,{multiline:true})}${field('vigor','辉格指标',c.vigor,{multiline:true})}</div>${field('target','Y1563参考目标',c.target,{multiline:true})}${field('note','版本差异/设计备注',c.note,{multiline:true})}<div class="fields2">${field('rionSource','瑞芬数据来源',c.rionSource,{list:state.sources.map(s=>({value:s.id,label:s.name}))})}${field('vigorSource','辉格数据来源',c.vigorSource,{list:state.sources.map(s=>({value:s.id,label:s.name}))})}</div></form>`;showModal('编辑竞品参数对标',body,`<div class="modalfooter"><button class="btn btn-danger btn-small" data-action="deleteCompare" data-id="${esc(cid)}">删除指标</button><button type="submit" form="compForm" class="btn btn-primary">保存对标指标</button></div>`);document.getElementById('compForm').dataset.id=cid}

function compressImage(file){return new Promise((resolve,reject)=>{if(!file.type.startsWith('image/'))return reject(new Error('仅允许图片'));let rd=new FileReader();rd.onerror=reject;rd.onload=()=>{let img=new Image();img.onload=()=>{let max=1400,scale=Math.min(1,max/Math.max(img.width,img.height));let w=Math.round(img.width*scale),h=Math.round(img.height*scale);let c=document.createElement('canvas');c.width=w;c.height=h;let ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',.77))};img.onerror=()=>reject(new Error('无法读取图片'));img.src=rd.result};rd.readAsDataURL(file)})}
async function handlePhotoFile(e){let file=e.target.files?.[0];if(!file||!photoTarget)return;let target=photoTarget;photoTarget=null;try{let data=await compressImage(file);if(target.kind==='hero'){state.heroDiagram={data,hidden:false}}else if(target.kind==='product'){let p=state.photos.find(x=>x.id===target.product);if(p){p.data=data;p.credit='本地上传：'+file.name}}else{let rec=target.kind==='item'?state.items.find(x=>x.id===editId):state.tests.find(x=>x.id===editingTestId);if(!rec){toast('记录已关闭，请重新选择');return}if(rec.photos.length>=8 && target.index===null){toast('单项最多8张，建议删除旧图片后上传');return}let o={id:id(),name:file.name,data,addedAt:now()};if(target.index===null)rec.photos.push(o);else rec.photos[target.index]=o}updated();if(target.kind==='product'||target.kind==='hero')render();else if(target.kind==='item')openItem(editId);else openTest(editingTestId);toast('图片已添加，可随完整HTML保存')}catch(err){toast('图片读取失败：'+err.message)}}

// A local HTML page cannot silently overwrite itself. The user must first grant a
// file handle through the browser's native save dialog. The handle is deliberately
// not persisted: reopening a copied project must not silently overwrite an old one.
let selectedHtmlHandle=null;
async function saveToFile(){
 if(typeof window.showSaveFilePicker!=='function'){
   if(confirm('当前浏览器不支持直接写入本地文件。可改为下载完整HTML副本。现在下载吗？')) exportHTML();
   return;
 }
 try{
   if(!selectedHtmlHandle){
     let name;
     try{name=decodeURIComponent(location.pathname.split('/').pop()||'')}catch(_){name=''}
     if(!/\.html?$/i.test(name))name=safeFilename(state.meta.title)+'_产品定义.html';
     selectedHtmlHandle=await window.showSaveFilePicker({suggestedName:name,types:[{description:'HTML 网页文件',accept:{'text/html':['.html','.htm']}}]});
   }
   let writer=await selectedHtmlHandle.createWritable();
   await writer.write(snapshotHTML());
   await writer.close();
   let time=new Date().toLocaleTimeString('zh-CN',{hour12:false});
   document.getElementById('save-status').textContent='✅ 已写入 HTML 文件 · '+selectedHtmlHandle.name+' · '+time;
   toast('已保存到 '+selectedHtmlHandle.name+'；再次点击可覆盖同一文件');
 }catch(err){
   if(err&&err.name==='AbortError')return;
   if(err&&['NotAllowedError','NotFoundError'].includes(err.name))selectedHtmlHandle=null;
   alert('未能写入本地 HTML：'+(err?.message||String(err))+'。原文件不会因这次操作被更新，请使用「另存 HTML 副本」备份。');
 }
}

return `<div class="section-head"><div><h2>项目立项依据 / 产品需求分析</h2><p>基于内部《动态倾角仪开发-内部立项资料》V2.2，原文中的尚未确定事项保持待确认。</p></div><button class="btn btn-small" data-action="projectSettings">编辑项目总名称</button></div>

<div class="report-section"><h3>版本/计划差异与需要复核的原始记录</h3>${(c.notes||[]).map(x=>`<div class="report-note">⚠ ${esc(x)}</div>`).join('')}</div>
<div class="report-section"><div class="section-head"><h2>立项需求清单</h2><p>保留资料§1.1的10项市场需求与§1.2的30项客户需求；部分是场景/待定要求，不是已冻结的技术参数。</p></div><div class="report-tabline"><button class="${charterReqTab==='market'?'active':''}" data-charter-tab="market">市场需求 ${a.length}</button><button class="${charterReqTab==='customer'?'active':''}" data-charter-tab="customer">客户需求 ${b.length}</button></div><div class="report-list">${rel.map((r,idx)=>`<div class="report-item"><b>${idx+1}. ${esc(r.name)}</b><p>${esc(r.content)}</p><span class="ref-small">${esc(r.source)}</span></div>`).join('')}</div></div>

function renderRoadmap(){let a=state.milestones||[];let done=a.filter(p=>p.status==='已完成').length;return `<div class="section-head"><div><h2>开发计划与阶段里程碑</h2><p>导入立项V2.2 §4.3第22–24页的15条原计划。时间为既定计划，不代表已经实际完成。</p></div><div class="action-row"><button class="btn btn-small" data-action="addMilestone">＋ 新增里程碑</button></div></div><div class="note-box warning-box" style="margin-bottom:15px">原始资料第2页标注项目计划完成日期为<strong>2026-12-31</strong>，但§4.3详细计划主要覆盖<strong>2026年05–09月</strong>。没有擅自填入10–12月工作，待项目负责人确认是否需要增补。</div><div class="panel panel-pad"><div class="action-row" style="justify-content:space-between"><div><strong class="mono">${done} / ${a.length}</strong><span class="small muted"> 已填写为已完成</span></div><span class="tag">原始计划不代表实际进度</span></div><div class="bar-outer" style="margin-top:10px"><div class="bar-inner" style="width:${a.length?100*done/a.length:0}%"></div></div></div><div class="panel" style="margin-top:15px"><div class="tablewrap"><table style="min-width:850px"><thead><tr><th>阶段</th><th>计划时段</th><th>工作内容</th><th>负责人（原始资料）</th><th>当前状态</th><th>实际结果 / 说明</th><th>操作</th></tr></thead><tbody>${a.map((m,i)=>`<tr><td><strong>${esc(m.id)}</strong></td><td class="mono">${esc(m.from)}${m.to&&m.to!==m.from?' → '+esc(m.to):''}</td><td>${esc(m.name)}</td><td class="small">${esc(m.owner)}</td><td>${badgeStatus(m.status)}</td><td class="small muted">${esc(shorten(m.result||'尚未录入',60))}</td><td><button class="table-action" data-action="editMilestone" data-id="${esc(m.id)}">更新</button></td></tr>`).join('')}</tbody></table></div></div><p class="hintline">点击“更新”填写真实状态和完成证据。原始计划日期保留，修改后的计划需记录变更说明。</p>`}
function editMilestone(pid){const m=state.milestones.find(x=>x.id===pid);if(!m)return;showModal('里程碑：'+m.id,`<form id="milestoneForm" data-id="${esc(m.id)}" class="modalbody">${field('name','阶段工作内容',m.name,{multiline:true})}<div class="fields2">${field('from','计划开始（月）',m.from)}${field('to','计划结束（月）',m.to)}</div>${field('owner','负责人 / 参与人',m.owner)}${field('status','实际执行状态',m.status,{list:['待确认','未开始','进行中','已完成','阻塞','取消']})}${field('result','实际完成情况 / 证据编号',m.result,{multiline:true})}${field('note','日期调整依据、阻塞原因与下一步',m.note,{multiline:true})}<div class="note-box">${esc(m.source||'新增阶段')}。此项不会因计划日期已过而自动标记完成。</div></form>`,`<div class="modalfooter"><button class="btn btn-small btn-danger" data-action="removeMilestone" data-id="${esc(m.id)}">删除里程碑</button><button class="btn btn-primary" type="submit" form="milestoneForm">保存更新</button></div>`,true)}
function renderBudget(){let a=state.budget||[];const plan=a.reduce((s,b)=>s+(Number(b.planned)||0),0);const filled=a.filter(b=>String(b.actual).trim()!=='');let actual=filled.reduce((s,b)=>s+(Number(b.actual)||0),0);const all=filled.length===a.length&&a.length>0;
return `<div class="section-head"><div><h2>经费预算与实际支出</h2><p>依据立项V2.2 §5第24页，金额单位为万元；实际支出字段初始全部留空，不虚构执行数据。</p></div><button class="btn btn-small" data-action="addBudget">＋ 新增预算项</button></div><div class="budget-grid"><div><small>立项预算合计</small><strong class="mono">${nfmt(plan)} <span style="font-size:13px">万元</span></strong><small>既定计划：19.00万元</small></div><div><small>已登记实际支出</small><strong class="mono">${filled.length?nfmt(actual):'未登记'} <span style="font-size:13px">${filled.length?'万元':''}</span></strong><small>已有 ${filled.length} / ${a.length} 项填写实际金额</small></div><div><small>预算差额（仅在实际录全后可用）</small><strong class="mono">${all?nfmt(plan-actual)+' 万元':'不可计算'}</strong><small>未填写≠实际支出为0</small></div></div><div class="panel"><div class="tablewrap"><table style="min-width:730px"><thead><tr><th>序号</th><th>费用类别</th><th>预算（万元）</th><th>实际（万元）</th><th>备注</th><th>操作</th></tr></thead><tbody>${a.map((b,i)=>`<tr><td>${i+1}</td><td><b>${esc(b.name)}</b></td><td class="mono">${nfmt(b.planned)}</td><td class="mono">${b.actual===''?'—':nfmt(b.actual)}</td><td class="small muted">${esc(shorten(b.note||'',70))}</td><td><button class="table-action" data-action="editBudget" data-id="${esc(b.id)}">编辑</button></td></tr>`).join('')}<tr style="background:#f5f9fc;font-weight:bold"><td colspan="2">合计</td><td class="mono">${nfmt(plan)}</td><td class="mono">${all?nfmt(actual):'部分未登记'}</td><td colspan="2">财务核对后更新</td></tr></tbody></table></div></div><div class="note-box" style="margin-top:15px">19万元是<strong>项目研发经费</strong>，不等于单台产品BOM成本；量产成本和目标售价应在产品定义项 R39/R40 单独冻结。</div>`}
function editBudget(bid){let b=state.budget.find(x=>x.id===bid);if(!b)return;showModal('预算项 · '+b.name,`<form id="budgetForm" class="modalbody" data-id="${esc(b.id)}">${field('name','经费类别',b.name)}<div class="fields2">${field('planned','立项预算（万元）',b.planned,{type:'text'})}${field('actual','实际支出（万元，未核实请留空）',b.actual,{type:'text'})}</div>${field('note','发票/采购/调整依据',b.note,{multiline:true})}</form>`,`<div class="modalfooter"><button class="btn btn-small btn-danger" data-action="removeBudget" data-id="${esc(b.id)}">删除类别</button><button type="submit" form="budgetForm" class="btn btn-primary">保存预算记录</button></div>`)}
function renderQuestions(){const a=state.questions||[];const open=a.filter(q=>q.status!=='已确认'&&q.status!=='已关闭');return `<div class="section-head"><div><h2>立项原文待决策与澄清</h2><p>针对资料不一致、未确定的规格或验收边界，单独列出问题；避免误当已定版参数。</p></div><div class="action-row"><span class="tag warn">${open.length} 项待确认</span><button class="btn btn-small" data-action="addQuestion">＋ 新增问题</button></div></div><div class="panel"><div class="tablewrap"><table style="min-width:850px"><thead><tr><th>编号/优先级</th><th>分类与问题</th><th>建议答复负责人</th><th>状态</th><th>处理结论</th><th>入口</th></tr></thead><tbody>${a.map(q=>`<tr><td><b>${esc(q.id)}</b><div class="tag ${q.priority==='P0'?'warn':'neutral'}">${esc(q.priority)}</div></td><td><b>${esc(q.category)}</b><div class="small muted" style="max-width:475px">${esc(q.question)}</div></td><td class="small">${esc(q.owner)}</td><td>${badgeStatus(q.status)}</td><td class="small muted">${esc(shorten(q.answer||'待答复',70))}</td><td><button class="table-action" data-action="editQuestion" data-id="${esc(q.id)}">答复 / 关闭</button>${q.related?`<div style="margin-top:6px"><button class="linked-action" data-edit="${esc(q.related)}">${esc(q.related)} 定义项</button></div>`:''}</td></tr>`).join('')}</tbody></table></div></div>`}
function renderRisksExtended(){return renderQuestions()+`<details class="risk-details" style="margin-top:20px"><summary>展开产品定义项的待评审、阻塞与决策记录（默认收起）</summary><div class="riskcontent">${renderRisks()}</div></details>`}
function editQuestion(qid){let q=state.questions.find(x=>x.id===qid);if(!q)return;showModal('待决策：'+q.id,`<form id="questionForm" class="modalbody" data-id="${esc(q.id)}">${field('category','问题分类',q.category)}${field('question','待解决事项',q.question,{multiline:true,rows:3})}<div class="fields2">${field('owner','责任人',q.owner)}${field('priority','紧急程度',q.priority,{list:['P0','P1','P2']})}</div>${field('status','处理状态',q.status,{list:['待确认','讨论中','已确认','已关闭','阻塞']})}${field('answer','评审结论 / 决定 / 数据证据',q.answer,{multiline:true,rows:4})}<div class="note-box">修改后会本地保存；答复中的关键规格还应同步更新相关定义项，才能完成基线冻结。</div></form>`,`<div class="modalfooter"><button class="btn btn-small btn-danger" data-action="removeQuestion" data-id="${esc(q.id)}">删除问题</button><button class="btn btn-primary" type="submit" form="questionForm">保存答复</button></div>`,true)}
// Registry of additional buttons and forms. Existing PRD controls remain unchanged.
document.addEventListener('click',e=>{
 let b=e.target.closest('button');if(!b)return;
 if(b.dataset.charterTab){e.preventDefault();e.stopImmediatePropagation();charterReqTab=b.dataset.charterTab;render();return}
 const action=b.dataset.action;
 if(!['editMilestone','addMilestone','removeMilestone','editBudget','addBudget','removeBudget','editQuestion','addQuestion','removeQuestion','viewProductPhoto'].includes(action))return;
 e.preventDefault();e.stopImmediatePropagation();
 if(action==='viewProductPhoto'){let p=state.photos.find(q=>q.id===b.dataset.product);if(!p?.data)return;return showModal(p.label||'技术资料图',`<div class="modalbody"><img src="${p.data}" style="display:block;max-height:75vh;max-width:100%;object-fit:contain;margin:auto" alt="技术资料"><p class="hintline">${esc(p.credit||'源自内部立项资料')}; 图片仅用于竞品参考，不代表我方冻结设计。</p></div>`,`<div class="modalfooter"><button type="button" class="btn" data-action="closeModal">关闭</button></div>`,true)}
 if(action==='editMilestone')return editMilestone(b.dataset.id);
 if(action==='addMilestone'){const m={id:id(),from:'',to:'',name:'新增研发阶段',owner:'',status:'待确认',result:'',note:'',source:'用户新增'};state.milestones.push(m);updated();render();return editMilestone(m.id)}
 if(action==='removeMilestone'){if(!confirm('确认删除该里程碑及其填写记录？'))return;state.milestones=state.milestones.filter(x=>x.id!==b.dataset.id);updated();closeModal();return render()}
 if(action==='editBudget')return editBudget(b.dataset.id);
 if(action==='addBudget'){const x={id:id(),name:'新增经费项',planned:0,actual:'',note:'新增预算项（不是原立项核准预算）'};state.budget.push(x);updated();render();return editBudget(x.id)}
 if(action==='removeBudget'){if(!confirm('确认删除该预算类别？'))return;state.budget=state.budget.filter(x=>x.id!==b.dataset.id);updated();closeModal();return render()}
 if(action==='editQuestion')return editQuestion(b.dataset.id);
 if(action==='addQuestion'){const q={id:id(),category:'新问题',question:'',owner:'',priority:'P1',related:'',status:'待确认',answer:'',updatedAt:''};state.questions.push(q);updated();render();return editQuestion(q.id)}
 if(action==='removeQuestion'){if(!confirm('确认删除该待决策事项？'))return;state.questions=state.questions.filter(x=>x.id!==b.dataset.id);updated();closeModal();return render()}
},true);
document.addEventListener('submit',e=>{
 const t=e.target;if(!['milestoneForm','budgetForm','questionForm'].includes(t.id))return;
 e.preventDefault();e.stopImmediatePropagation();const f=new FormData(t);let x;
 if(t.id==='milestoneForm'){x=state.milestones.find(m=>m.id===t.dataset.id);if(!x)return;for(let k of ['name','from','to','owner','status','result','note'])x[k]=String(f.get(k)||'').trim()}
 if(t.id==='budgetForm'){x=state.budget.find(m=>m.id===t.dataset.id);if(!x)return;let plan=Number(f.get('planned')),actual=String(f.get('actual')||'').trim();if(!Number.isFinite(plan)||plan<0||(actual!==''&&(!Number.isFinite(Number(actual))||Number(actual)<0))){alert('预算和实际支出必须是非负数字。');return}x.name=String(f.get('name')||'').trim();x.planned=plan;x.actual=actual===''?'':Number(actual);x.note=String(f.get('note')||'').trim()}
 if(t.id==='questionForm'){x=state.questions.find(q=>q.id===t.dataset.id);if(!x)return;for(let k of ['category','question','owner','priority','status','answer'])x[k]=String(f.get(k)||'').trim();x.updatedAt=new Date().toLocaleString('zh-CN')}
 updated();closeModal();render();toast('记录已保存到本机');
},true);

document.addEventListener('input',e=>{if(e.target.id==='req-search'){searchTerm=e.target.value;let pos=e.target.selectionStart;let wrap=e.target.closest('.panel');let tb=wrap?.querySelector('tbody');let v=renderRequirements();let doc=new DOMParser().parseFromString(v,'text/html');if(tb)tb.innerHTML=doc.querySelector('tbody')?.innerHTML||'';let stat=wrap?.querySelector('.toolbar .muted.small');if(stat)stat.textContent=`筛选结果 ${state.items.filter(i=>(modFilter==='all'||i.moduleId===modFilter)&&((i.name+i.definition+i.target+i.benchRion+i.benchVigor+i.issue+i.owner).toLowerCase().includes(searchTerm.toLowerCase()))).length} / ${state.items.length}`}});

const oldInitState=initState;
initState=function(){
 if(SEED.meta&&SEED.meta.generic){try{let v=localStorage.getItem(STORAGE);if(v){let p=JSON.parse(v);if(p.meta&&Array.isArray(p.modules)&&Array.isArray(p.items)&&Array.isArray(p.tests))state=p}}catch(e){console.warn('本地存储无法读取',e)}normalize();}
 else oldInitState();
 state.meta.compA??='瑞芬 HDA436T';state.meta.compB??='辉格 SST810';
 state.photos??=[];state.sources??=[];
};
const oldShell=renderShell;
renderShell=function(){oldShell();if(state.meta.generic){const foot=document.querySelectorAll('.kpi .kfoot');if(foot[0])foot[0].textContent='可自由增删，无预置定义项目';}
 const b=document.querySelector('.brandmark');if(b)b.textContent=(state.meta.title||'项').slice(0,1).toUpperCase();
};
const oldRenderRequirements=renderRequirements;

function safeResourceUrl(url){let s=String(url||'').trim();if(!s)return '';try{let u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:''}catch(_){return ''}}
sourceLink=function(sid){let s=sourceById(sid);if(!s)return '<span class="muted">待添加来源</span>';let href=safeResourceUrl(s.url);return href?`<a href="${esc(href)}" title="${esc(s.name)}" target="_blank" rel="noopener noreferrer">${esc(s.name)} ↗</a>`:`<span class="muted" title="${esc(s.name)}">${esc(s.name)} · 无外部链接</span>`};
renderProductRef=function(pid,title,line,sub){let p=state.photos.find(x=>x.id===pid);if(!p)return '';return `<div class="product-card"><div class="product-illustration">${p.data?`<img style="width:100%;height:100%;object-fit:contain" src="${p.data}" alt="${esc(p.label||title)}">`:'<div class="glass-empty">暂无配图</div>'}</div><div class="content"><div class="imglabel">${esc(p.credit||'项目参考图，可编辑')}</div><strong>${esc(p.label||title)}</strong><div style="font-size:12px;margin:8px 0;color:#6b7d99">${esc(p.description||sub||'')}</div><div class="action-row">${p.data?`<button class="btn btn-small" data-action="viewProductPhoto" data-product="${esc(pid)}">查看原图</button>`:''}<button class="btn btn-small" data-action="replaceProductPhoto" data-product="${esc(pid)}">${p.data?'替换图片':'上传图片'}</button><button class="btn btn-small" data-action="editAsset" data-id="${esc(pid)}">图卡设置</button><button class="btn btn-small btn-danger" data-action="deleteAsset" data-id="${esc(pid)}">删除图卡</button></div></div></div>`};
renderSources=function(){const sources=state.sources||[],assets=state.photos||[];return `<div class="section-head"><div><h2>资料链接与技术配图</h2><p>所有资料网址、名称、版本、说明均可编辑或删除；参考图片可上传、替换和移除。变更同步纳入完整 HTML 快照。</p></div><div class="action-row"><button class="btn btn-primary btn-small" data-action="addSource">＋ 添加资料链接</button><button class="btn btn-small" data-action="addAsset">＋ 新增图片</button></div></div><div class="glass-help"><b>资料归档中心</b><p>网址不写死在系统里，未来换项目时可以直接删除旧资料、加入新资料。内部 DOCX、PDF 文件不会随网址自动嵌入 HTML；技术图片上传后会压缩并嵌入，离线仍可查看。删除某条资料时会同步清理相关定义项的来源引用。</p></div><div class="section-head"><div><h2>外部链接 / 资料目录 <span class="tag">${sources.length}</span></h2><p>点击“编辑”可以更换链接；删除需要确认，所有网址仅允许 http(s) 协议。</p></div></div><div class="sources-grid">${sources.map(s=>{let h=safeResourceUrl(s.url);return `<div class="sourcecard panel"><span class="tag">${esc(s.type||'资料')}</span><h3>${esc(s.name||'未命名资料')}</h3><p><b>${esc(s.version||'未指定版本')}</b></p><p>${esc(s.note||'暂无说明')}</p>${h?`<a class="resource-url" href="${esc(h)}" target="_blank" rel="noopener noreferrer">${esc(h)} ↗</a>`:`<span class="resource-url muted">尚未设置网址，可关联本地资料的名称与版本</span>`}<div class="action-row" style="margin-top:17px"><button class="btn btn-small" data-action="editSource" data-id="${esc(s.id)}">编辑 / 换链接</button><button class="btn btn-small btn-danger" data-action="deleteSource" data-id="${esc(s.id)}">删除</button></div></div>`}).join('')||'<div class="panel glass-empty"><strong>还没有资料链接</strong><span>点击「添加资料链接」建立本项目的参考资料目录。</span></div>'}</div><div class="section-head"><div><h2>参考图片 / 工程证据 <span class="tag">${assets.length}</span></h2><p>适用于竞品尺寸图、样机照片、原理框图、测试曲线及会议图示。</p></div></div><div class="asset-grid">${assets.map(p=>`<article class="panel asset-card"><div class="asset-visual">${p.data?`<img src="${p.data}" alt="${esc(p.label||'技术图片')}">`:'<span>尚未上传图片</span>'}</div><h3>${esc(p.label||'未命名图片')}</h3><p>${esc(p.description||p.credit||'可更换、删除')}</p><div class="action-row">${p.data?`<button class="btn btn-small" data-action="viewProductPhoto" data-product="${esc(p.id)}">放大</button>`:''}<button class="btn btn-small" data-action="replaceProductPhoto" data-product="${esc(p.id)}">${p.data?'替换':'上传'}</button><button class="btn btn-small" data-action="editAsset" data-id="${esc(p.id)}">改名</button><button class="btn btn-small btn-danger" data-action="deleteAsset" data-id="${esc(p.id)}">删除</button></div></article>`).join('')||'<div class="panel glass-empty"><strong>暂无参考图片</strong><span>任何新项目都可以从零上传图纸和实物照片。</span></div>'}</div>`};
function editSource(sid){let x=state.sources.find(s=>s.id===sid);if(!x)return;showModal('编辑资料与链接',`<form id="sourceForm" data-id="${esc(sid)}" class="modalbody">${field('name','资料名称',x.name)}<div class="fields2">${field('type','资料类型',x.type||'参考资料')}${field('version','版本 / 日期',x.version||'')}</div>${field('url','资料网址（可清空，即删除该网址）',x.url||'',{placeholder:'https://example.com/资料'})}${field('note','引用说明 / 注意事项',x.note||'',{multiline:true,rows:4})}<p class="hintline">编辑或清空网址不会影响已填写的产品规格；如果删除整条资料，则清理它在定义表、竞品对标中的引用。</p></form>`,`<div class="modalfooter"><button class="btn btn-danger btn-small" data-action="deleteSource" data-id="${esc(sid)}">删除整条资料</button><button class="btn btn-primary" type="submit" form="sourceForm">保存资料</button></div>`,true)}

function addAsset(){let p={id:id(),label:'新增技术图片',data:'',credit:'用户上传',description:''};state.photos.push(p);updated();render();choosePhoto('product',null,p.id)}
function editAsset(sid){let p=state.photos.find(x=>x.id===sid);if(!p)return;showModal('技术图片设置',`<form id="assetForm" data-id="${esc(sid)}" class="modalbody">${field('label','图片名称',p.label||'')}${field('credit','图片来源 / 版本',p.credit||'')}${field('description','图片说明',p.description||'',{multiline:true,rows:4})}</form>`,`<div class="modalfooter"><button class="btn btn-danger btn-small" data-action="deleteAsset" data-id="${esc(sid)}">删除图卡</button><button class="btn btn-primary" type="submit" form="assetForm">保存</button></div>`)}

renderComparison=function(){let a=state.meta.compA||'竞品 A',b=state.meta.compB||'竞品 B';return `<div class="section-head"><div><h2>竞品参数对标 · ${state.comparisons.length} 项</h2><p>支持修改竞品名称、增加指标和删除已有指标，资料来源由「资料链接与配图」统一管理。</p></div><div class="action-row"><button class="btn btn-small" data-view="sources">管理引用链接</button><button class="btn btn-primary btn-small" data-action="addCompare">＋ 新增对标指标</button></div></div><div class="panel"><div class="tablewrap"><table class="compare-table"><thead><tr><th>工程指标</th><th>${esc(a)}</th><th>${esc(b)}</th><th>本项目目标 / 待冻结</th><th>对比说明</th><th>操作</th></tr></thead><tbody>${state.comparisons.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${expandableCell(c.rion||'待核实')}<div class="tiny">${c.rionSource?sourceLink(c.rionSource):''}</div></td><td>${expandableCell(c.vigor||'待核实')}<div class="tiny">${c.vigorSource?sourceLink(c.vigorSource):''}</div></td><td>${expandableCell(c.target||'待定义')}</td><td>${expandableCell(c.note||'—')}</td><td><button class="btn btn-small" data-edit-compare="${esc(c.id)}">编辑</button></td></tr>`).join('')||'<tr><td colspan="6"><div class="glass-empty"><strong>没有竞品对标项目</strong><span>如不需要竞品对标，可以留空；也可以自由添加。</span></div></td></tr>'}</tbody></table></div></div>`};
openCompare=function(cid){let c=state.comparisons.find(x=>x.id===cid);if(!c)return;let a=state.meta.compA||'竞品 A',b=state.meta.compB||'竞品 B';let choices=[{value:'',label:'不关联来源'},...state.sources.map(s=>({value:s.id,label:s.name}))];let body=`<form class="modalbody" id="compForm" data-id="${esc(cid)}">${field('name','对标指标',c.name)}<div class="fields2">${field('rion',a+'参考值',c.rion,{multiline:true})}${field('vigor',b+'参考值',c.vigor,{multiline:true})}</div>${field('target','本项目目标',c.target,{multiline:true})}${field('note','差异与设计备注',c.note,{multiline:true})}<div class="fields2">${field('rionSource',a+'数据来源',c.rionSource,{list:choices})}${field('vigorSource',b+'数据来源',c.vigorSource,{list:choices})}</div><p class="hintline">可在「资料链接与配图」里新增、编辑或删除外部网址。</p></form>`;showModal('竞品对标指标',body,`<div class="modalfooter"><button class="btn btn-danger btn-small" data-action="deleteCompare" data-id="${esc(cid)}">删除指标</button><button type="submit" form="compForm" class="btn btn-primary">保存</button></div>`,true)};
projectSettings=function(){let m=state.meta;showModal('项目设置 · 通用化管理',`<form id="projectForm" class="modalbody">${field('title','项目总名称',m.title)}${field('subtitle','项目副标题',m.subtitle)}<div class="fields2">${field('owner','项目负责人',m.owner)}${field('version','产品定义版本',m.version)}</div><div class="modal-section">竞品名称（可直接更换，也可留空）</div><div class="fields2">${field('compA','对标对象 A',m.compA||'竞品 A')}${field('compB','对标对象 B',m.compB||'竞品 B')}</div><div class="note-box"><b>适用于其它研发项目：</b>推荐下载「通用空白模板」，从零建立。已有的任务、资料、图片、试验、预算都可以增删改。当前文件不与其它项目云端同步。</div></form>`,`<div class="modalfooter"><span class="muted small">改名与竞品名称同步保存</span><button class="btn btn-primary" type="submit" form="projectForm">保存设置</button></div>`,true)};

renderOverviewExtended=function(){if(!state.meta.generic)return oldOverviewExtended();let count=state.items.length,done=state.items.filter(i=>['已确认','已验证'].includes(i.status)).length;return `<div class="glass-help"><b>◈ 通用研发产品定义工作台</b><p>这是一份独立的空白项目。先设置名称并建立模块，再依次添加规格、对标资料和验证计划；不用重新写代码。支持单机自动保存、导出完整 HTML、JSON 备份。</p><div class="action-row" style="margin-top:15px"><button class="btn btn-primary" data-action="createFreshProject">＋ 从模板创建独立项目</button><button class="btn" data-action="projectSettings">⚙ 设置项目名称</button><button class="btn" data-action="manageModules">＋ 新建模块</button><button class="btn" data-action="addItem">＋ 新增定义项</button><button class="btn" data-action="addSource">＋ 添加资料链接</button></div></div><div class="generic-grid"><div class="panel generic-tile"><span class="tag draft">01 · 定义</span><h3>先确定产品做什么</h3><p>按研发专业建立多个模块，录入需求、目标指标、责任人、验收方法及实际结果。</p><button class="btn btn-small" data-action="manageModules">管理模块 →</button></div><div class="panel generic-tile"><span class="tag warn">02 · 对标</span><h3>竞品和资料自由替换</h3><p>两个对标对象名称可改；来源网址、资料版本和参考配图都可以分别新增、替换或删除。</p><button class="btn btn-small" data-view="sources">资料与配图 →</button></div><div class="panel generic-tile"><span class="tag ready">03 · 验证</span><h3>建立证据闭环</h3><p>把规格映射到验证试验，登记测试结果、上传曲线，并归档里程碑、预算和待决策问题。</p><button class="btn btn-small" data-view="verification">验证计划 →</button></div></div><div class="section-head"><div><h2>当前项目概况</h2><p>每项定义都可编辑，项目之间数据不自动共享。</p></div><button class="btn btn-small" data-view="requirements">进入产品定义 →</button></div><div class="panel panel-pad"><div class="action-row" style="gap:14px;flex-wrap:wrap"><span class="tag">${state.modules.length} 个模块</span><span class="tag">${count} 项定义</span><span class="tag ready">${done} 项已确认</span><span class="tag">${state.sources.length} 个资料链接</span><span class="tag">${state.photos.length} 张图片</span><span class="tag">${state.tests.length} 项试验</span></div>${count?`<div class="bullet-card" style="margin-top:14px">${state.items.slice(0,7).map(x=>`<div class="bullet-line" data-view-item="${esc(x.id)}"><div style="flex:1"><strong>${esc(x.name)}</strong><small>${esc(moduleName(x.moduleId))}</small></div>${badgeStatus(x.status)}</div>`).join('')}</div>`:'<div class="glass-empty"><strong>当前还没有定义要素</strong><span>点击「新建模块」后，就能开始新增任务和产品规格。</span></div>'}</div><details class="risk-details" style="margin-top:20px"><summary>待确认和阻塞事项 · ${state.questions.length+issues().length} 项（默认收起）</summary><div class="riskcontent"><button class="btn btn-small" data-view="risks">前往问题集中管理 →</button></div></details>`};

/* V6: newly confirmed Y1563 product-definition baseline, preserve test evidence and independent competitors */
const _normalizeV6Base=normalize;
normalize=function(){
  _normalizeV6Base();
  if(!state.meta.generic && !state.meta.confirmedBaselineV6){
    const originalIds=new Set(SEED.items.map(it=>it.id));
    for(const it of state.items){
      if(!originalIds.has(it.id))continue;
      if(['待定义','草拟中','待评审'].includes(it.status))it.status='已确认';
      if(['建议目标','方案评审中'].includes(it.targetLevel))it.targetLevel='已确认';
    }
    for(const q of (state.questions||[])){if(q.status==='待确认' && !(q.answer||'').trim())q.status='待补充'}
    state.meta.confirmedBaselineV6=true;
    if(state.meta.version==='产品定义 PRD v1.0 · 立项V2.2依据（待评审）')state.meta.version='产品定义 PRD v1.0 · 立项 V2.2 已确认目标';
    // Persist once to upgrade any older browser cache without wiping measurements/attachments.
    updated();
  }
};

function _makeFluidTable(html,type){
  const holder=document.createElement('div');holder.innerHTML=html;
  const table=holder.querySelector(type==='req'?'.req-table':'.compare-table');
  if(!table)return html;
  table.classList.add(type==='req'?'fluid-req':'fluid-compare');
  const cs=state.competitors||[];
  const n=cs.length;
  // Four or more competitors get a compact expandable comparison column.
  // This is necessary to keep ALL fields readable without a horizontal scrollbar.
  if(n>3){
    const heads=[...table.querySelectorAll('thead tr > th')];
    if(heads.length>=n+(type==='req'?6:4)){
      const compStart=type==='req'?2:1;
      const first=heads[compStart];first.textContent='竞品参考（'+n+'家）';
      for(let j=n-1;j>=1;j--)heads[compStart+j].remove();
      for(let tr of table.querySelectorAll('tbody tr')){
        const cells=[...tr.children];if(cells.length<n+4)continue;
        const rowKey=type==='req'?tr.querySelector('td b')?.textContent:tr.querySelector('td b')?.textContent;
        const record=(type==='req'?state.items:state.comparisons).find(it=>(type==='req'?it.id:it.name)===rowKey);
        const cell=cells[compStart];
        let snippets=cs.map(c=>{const v=record?compRecord(record,c.id):{value:'',sourceId:''};return `<div class="comp-inline-entry"><strong>${esc(c.name)}</strong>${expandableCell(v.value||'—')}${v.sourceId?`<div class="tiny">${sourceLink(v.sourceId)}</div>`:''}</div>`}).join('');
        cell.innerHTML=`<details class="comp-inline"><summary>查看 ${n} 家竞品的参数</summary>${snippets}</details>`;
        for(let j=n-1;j>=1;j--)cells[compStart+j].remove();
      }
    }
  }
  if(type==='req'){
    let head=[...table.querySelectorAll('thead tr > th')];
    const targetHead=head[head.length-4];if(targetHead)targetHead.textContent=state.meta.generic?'本项目目标':'DTS 系列目标';
    const targetIx=head.length-4;
    table.querySelectorAll('tbody tr').forEach(tr=>{
      const cell=tr.children[targetIx];if(!cell)return;
      for(const b of cell.querySelectorAll('.tag'))b.remove(); // one authoritative status badge only
    });
  }else{
    let head=[...table.querySelectorAll('thead tr > th')];
    const targetHead=head[head.length-3];if(targetHead)targetHead.textContent=state.meta.generic?'本项目目标':'DTS 系列目标';
  }
  let widths;
  if(type==='req'){
    if(n>3)widths=[8,16,23,30,6,8,9];
    else if(n===3)widths=[7,12,12.33,12.34,12.33,24,5,7,8];
    else if(n===2)widths=[7.5,14,17.5,17.5,25,5,6.5,7];
    else if(n===1)widths=[8,18,24,29,6,7,8];
    else widths=[9,20,45,7,9,10];
  }else{
    if(n>3)widths=[14,29,32,16,9];
    else if(n===3)widths=[11,16,16,16,23,12,6];
    else if(n===2)widths=[13,21,21,27,11,7];
    else if(n===1)widths=[15,31,32,14,8];
    else widths=[18,47,25,10];
  }
  let headers=[...table.querySelectorAll('thead th')];
  if(headers.length===widths.length){
    const cg=document.createElement('colgroup');widths.forEach(w=>{let col=document.createElement('col');col.style.width=w+'%';cg.appendChild(col)});
    table.prepend(cg);
  }
  table.querySelectorAll('tbody tr').forEach(tr=>{
    [...tr.children].forEach((td,i)=>{
      td.dataset.label=headers[i]?.textContent.trim()||'';
      if(i===1 || type==='compare'&&i===0)td.dataset.cellRole='name';
      if(i===headers.length-1)td.dataset.cellRole='action';
    });
  });
  // Accurate wording: the requirements baseline is confirmed, not yet test-validated.
  if(type==='req'){
    let tip=holder.querySelector('.hintline');
    if(tip)tip.textContent=state.meta.generic?'目标确认与实测验证分别记录；只有获得测试证据后才标记「已验证」。':'DTS 系列产品基线已确认；「已确认」表示定义已确定，并不代表样机测试已通过。未给出具体数值的细项仍须后续补充。';
  }else{
    let p=holder.querySelector('.section-head p');if(p)p.textContent='竞品数量可自由增减。窄屏或竞品超过三家时改用行内展开，不需拖动底部滚动条。';
  }
  return holder.innerHTML;
}

 return `<div class="dts-overview-nudge"><div><strong>DTS 系列 · Y1563 项目产品基线</strong><p>已确定的研发目标保持已确认；另有 ${count} 项从瑞芬 / 辉格资料整理的可选补充建议。</p></div><button class="btn btn-small" data-view="suggestions">查看并逐项确认 →</button></div>`+s.replace('已形成产品定义基线','已有明确产品目标').replaceAll('查看立项依据和','查看项目依据和').replaceAll('项待决策','项执行细节');
};
function dtsAcceptProposal(id){let it=state.items.find(i=>i.id===id);if(!it||!proposalPending(it))return;
 if(!confirm(`确认将「${it.name}」的参考建议正式纳入 ${state.meta.model||'DTS系列'} 产品目标吗？\n\n${it.proposal}\n\n此操作会记录确认时间；不等于实测通过。`))return;
 const old=it.target||'';const baseMissing=/尚未.*确认|尚未正式确认|尚未由项目组确认|未定义|暂无明确/.test(old);
 it.target=baseMissing?it.proposal:old+'\n【补充已确认】'+it.proposal;
 it.proposalStatus='已确认';it.status='已确认';it.targetLevel='已确认';
 it.logs??=[];it.logs.push({date:now().slice(0,19).replace('T',' '),text:'用户确认采用外部补充建议，作为DTS产品目标；来源：'+(it.proposalSourceIds||[]).join('、')});
 updated();closeModal();render();toast('已确认纳入DTS产品目标，实测验证状态未变');
}
document.addEventListener('click',function(e){let b=e.target.closest('button');if(!b||b.dataset.action!=='dtsAcceptProposal')return;
 e.preventDefault();e.stopImmediatePropagation();dtsAcceptProposal(b.dataset.id)
},true);

const DTS_V7_COMPARISONS={"C01":"双轴Roll/Pitch，输出三轴加速度与角速度；预留航向/三轴姿态扩展","C02":"Roll±180°，Pitch±90°；小量程可配置","C03":"【已确认】静态精度目标≤±0.02°","C04":"【已确认】动态精度目标≤±0.05°，挑战≤±0.02°；测试口径待评审","C05":"DTS数字分辨率候选0.01°；有效分辨力需测试，待确认","C06":"【已确认】首版100Hz；200Hz方向为后续评估；端到端时延候选≤20ms（待确认）","C07":"-40～+85℃","C08":"DC 9～36V","C09":"12V工作电流<80mA（功率<0.96W换算），峰值/工况待定义","C10":"首版RS485/Modbus RTU；后期CAN/CANopen，4～20mA按需评估","C11":"首版IP67；结构预留IP68升级","C12":"1000g@1ms，三轴向半正弦（目标，需落实测试）","C13":"≥10grms、10～1000Hz（目标）","C14":"待郑胜义结构设计冻结；竞品尺寸不可作为本品尺寸","C15":"≤200g（结构、防护、连接器方案冻结后确认）","C16":"六轴MEMS IMU；实际芯片/量程/噪声待硬件评审","C17":"DTS候选MTBF≥98,000h，挑战≥100,000h（待确认，不是已验证性能）"};
function upgradeV8(){
 if(state.meta?.generic || state.meta?.confirmedBaselineV8)return;
 for(const v of SEED.items){
  const p=state.items.find(x=>x.id===v.id);if(!p)continue;
  const old=DTS_V7_ITEMS[v.id]||{};
  for(const key of ['target','acceptance']){
   if(!p[key] || String(p[key])===String(old[key]))p[key]=v[key];
  }
  // Keep any deliberate user change to verified, blocked, or in-progress status.
  for(const key of ['status','targetLevel']){
    if(!p[key] || p[key]===old[key] || ['待确认','草拟中','待评审','方案评审中'].includes(p[key]))p[key]=v[key];
  }
  p.sourceCategory=v.sourceCategory;
  p.sourceAdopted=v.sourceAdopted;
  p.sourceAdoptedNote=v.sourceAdoptedNote;
  if(p.proposal===old.proposal){p.proposal='';p.proposalStatus='已确认';p.proposalSourceIds=[];}
 }
 for(const v of SEED.comparisons){const p=state.comparisons.find(x=>x.id===v.id);if(!p)continue;
   if(!p.target || p.target===DTS_V7_COMPARISONS[v.id])p.target=v.target;
 }
 for(const v of SEED.questions){const p=state.questions.find(x=>x.id===v.id);if(!p)continue;
   if(!p.answer)p.answer=v.answer;
   if(['待补充','待确认','待评审'].includes(p.status))p.status=v.status;
 }
 for(const v of SEED.sources){if(!state.sources.some(x=>x.id===v.id))state.sources.push(deepCopy(v));}
 state.meta.model='DTS 系列';state.meta.projectCode='Y1563';
 if(!state.meta.title||state.meta.title==="DTS 系列动态倾角仪 · 产品定义工作台")state.meta.title=SEED.meta.title;
 if(!state.meta.version||state.meta.version==="DTS 产品定义 V3.0 · 已确认版")state.meta.version=SEED.meta.version;
 if(!state.meta.subtitle||state.meta.subtitle==="DTS 系列产品规格 · 项目编号 Y1563 · 核心指标与竞品验证")state.meta.subtitle=SEED.meta.subtitle;
 state.meta.sourceNote=SEED.meta.sourceNote;
 state.meta.confirmedBaselineV8=true;
 state.meta.dtsRevision=SEED.meta.dtsRevision;
 state.meta.specSources=SEED.meta.specSources;
 updated();
}
// Prevent the former v7 normalizer from downgrading confirmed DTS baseline values.
const _v8OldDtsNormalize=dtsNormalizeModel;
dtsNormalizeModel=function(){
 if(state.meta?.confirmedBaselineV8){
  state.meta.model??='DTS 系列';state.meta.projectCode??='Y1563';
  state.charter??={};state.charter.code=state.meta.projectCode;
  state.charter.productModel=state.meta.model;
  return;
 }
 _v8OldDtsNormalize();
};
const _v8_initState=initState;

// Replace obsolete pending-adoption page with explicit source-of-specification overview.
if(NAV.some(n=>n[0]==='suggestions'))NAV.find(n=>n[0]==='suggestions')[2]='规格来源与采用规则';
renderSuggestions=function(){
 const adopted=state.items.filter(i=>i.status==='已确认'||i.status==='已验证').length;
 const rows=state.items.map(i=>`<tr><td class="mono">${esc(i.id)}</td><td><b>${esc(i.name)}</b></td><td>${esc(i.sourceAdopted||'项目定义')}</td><td>${badgeStatus(i.status)}</td><td><button class="table-action" data-view-item="${esc(i.id)}">查看目标</button></td></tr>`).join('');
 return `<div class="section-head"><div><h2>DTS 产品规格 · 来源与采用规则</h2><p>已有目标沿用内部既定要求；缺失的可用参数参照瑞芬 HDA436T 公开规格，未公开事项采用DTS工程约定；定义确认与实测通过分开管理。</p></div><span class="tag ready">${adopted} / ${state.items.length} 条目标已确认</span></div>
 <div class="note-box" style="margin-bottom:18px"><b>瑞芬公开参数参考：</b> <a target="_blank" rel="noopener noreferrer" href="https://www.rionsystem.com/list_94/177.html">HDA436T 官方产品资料 ↗</a>。MTBF、温漂、分辨率、尺寸均为本项目采用的研发目标，不等于DTS已量产或已取得认证。<br><b>实际值：</b> 样机测试、出厂检测、采购价格等必须录入真实记录，不能从竞品参数虚构。</div>
 <div class="panel"><div class="tablewrap"><table><thead><tr><th>编号</th><th>定义项</th><th>目标来源</th><th>定义状态</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
};
// Make overview guidance and KPI consistent with new approved baseline.
const _v8RenderShell=renderShell;
renderShell=function(){_v8RenderShell();if(state.meta.generic)return;
 const ks=document.querySelectorAll('#kpis .kpi');const k=ks[2];if(k){k.dataset.kpi='suggestions|all';
 const lab=k.querySelector('.klabel');if(lab)lab.textContent='已确认产品目标 / 阻塞';
 const val=k.querySelector('b');if(val)val.textContent=state.items.filter(i=>['已确认','已验证'].includes(i.status)).length+' / '+countStatus('阻塞');
 const foot=k.querySelector('.kfoot');if(foot)foot.textContent='点击查看规格采用依据';}
};
const _v8Overview=renderOverviewExtended;
renderOverviewExtended=function(){let s=_v8Overview();return s.replace(/已确定的研发目标保持已确认；另有\s*\d+\s*项从瑞芬 \/ 辉格资料整理的可选补充建议。/g,'48项产品定义已建立明确目标，瑞芬对标采用项目有来源记录。')
 .replace('查看并逐项确认 →','查看规格来源 →')
 .replace(/状态均须进一步评审或验证；不是实测达标数据。/g,'产品目标已确认；样机实际性能须另行试验验证。')
 .replace('优先冻结的核心需求','DTS 已确认核心规格')
 .replace('立项与产品规格总览','DTS 系列产品规格总览')
 .replaceAll('待确认补充','已采用规格')};
const _v8Requirements=renderRequirements;
renderRequirements=function(){return _v8Requirements().replace('◇ 补充建议 0','◇ 来源与采用规则').replace('「待确认」=补充候选参数尚未批准；','')};
// Present missing measured data as explicitly unmeasured instead of a confusing blank cell.
const _v8ViewItem=viewItem;
viewItem=function(id){_v8ViewItem(id);const grid=document.querySelector('#dialog-layer .readonly-grid');if(!grid)return;
 const i=state.items.find(x=>x.id===id);if(!i)return;
 const f=[...grid.querySelectorAll('.readonly-field')].find(x=>x.querySelector('.rf-label')?.textContent.includes('实际测试结果'));
 if(f && !(i.actual||'').trim()){const val=f.querySelector('.rf-value');if(val)val.textContent='尚未进行或尚未录入DTS样机实测；已确认的是产品目标，不是测试结果。'}
};

initState();render();
